<style>
:root{
  --bg:#F1EFF7; --panel:#FFFFFF; --ink:#1A1630; --muted:#645E78; --line:#E2DEEC;
  --accent:#6E42E5; --accent-soft:#EEE8FD; --accent-ink:#FFFFFF;

  --frame:#15121F;
  --f-body:"Figtree","Noto Sans Bengali", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-disp:"Bricolage Grotesque", "Figtree","Noto Sans Bengali", ui-sans-serif, system-ui, sans-serif;
  --f-app:"Poppins", "Noto Sans Bengali", "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F0D16; --panel:#1A1725; --ink:#ECE9F6; --muted:#9E98B3; --line:#2D2940;
    --accent:#9372F2; --accent-soft:#2A2146; --accent-ink:#FFFFFF;
    --coach:#F2B03F; --coach-soft:#33280F; --ok:#3CC58A; --ok-soft:#10301F; --frame:#000000;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F0D16; --panel:#1A1725; --ink:#ECE9F6; --muted:#9E98B3; --line:#2D2940;
  --accent:#9372F2; --accent-soft:#2A2146; --accent-ink:#FFFFFF;
  --coach:#F2B03F; --coach-soft:#33280F; --ok:#3CC58A; --ok-soft:#10301F; --frame:#000000;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Shell ---------- */
#shell{height:100%;display:grid;grid-template-columns:minmax(300px,390px) 1fr}
#panel{height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:26px 20px 30px;display:flex;flex-direction:column;gap:18px}
#stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 16px;min-width:0}
.brand h1{font-family:var(--f-disp);font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:8px 0 0;color:var(--muted);line-height:1.45;max-width:36ch}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-top:14px}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.mod{display:grid;grid-template-columns:32px 1fr;gap:11px;align-items:start;padding:11px 12px;border-radius:14px;border:1px solid var(--line);width:100%;transition:background .15s,border-color .15s}
.mod:hover{border-color:var(--accent)}
.mod[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.mod .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.mod .num.done{background:var(--ok);color:#fff}
.mod .num.free{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.mod b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.mod small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.mod .meta{font-size:11.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:8px 0 2px;padding:0 0 0 4px;display:flex;flex-direction:column;gap:6px}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:12.5px;line-height:1.35;color:var(--muted)}
.steps li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10px;margin-top:1px}
.steps li.d{color:var(--ink)} .steps li.d i{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.c{color:var(--ink);font-weight:600} .steps li.c i{border-color:var(--coach);background:var(--coach-soft)}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- Coach ---------- */
#coach{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#coach .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
#coach .stp{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--coach);font-variant-numeric:tabular-nums;white-space:nowrap}
#coach .mname{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coach .hint{font-size:15.5px;font-weight:600;line-height:1.4;text-wrap:pretty}
#coach .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
#coach .bar i{display:block;height:100%;background:var(--coach);transition:width .3s}
#coach .btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.mob-only{display:none}

/* ---------- Phone ---------- */
#phone{position:relative;width:380px;max-width:100%;height:clamp(560px,calc(100dvh - 200px),800px);border-radius:42px;border:10px solid var(--frame);background:#fff;overflow:hidden;box-shadow:0 30px 60px -30px rgba(40,20,90,.35);flex-shrink:0;min-height:0}
.sbar{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:#111;background:#fff;font-family:var(--f-app);font-variant-numeric:tabular-nums}
.sbar span:last-child{display:flex;gap:5px;align-items:center}
.sbar i{display:inline-block;width:16px;height:8px;border:1.5px solid #111;border-radius:2px}
#app{position:absolute;inset:26px 0 0 0}
@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #shell[data-view="menu"] #stage{display:none}
  #shell[data-view="play"] #panel{display:none}
  #panel{border-right:0;padding:22px 16px 28px}
  #stage{padding:0;gap:0;justify-content:flex-start}
  #coach{max-width:none;border-radius:0;border-width:0 0 1px 0;padding:10px 16px}
  #coach .hint{font-size:15px}
  #phone{width:100%;height:auto;flex:1;border:0;border-radius:0;box-shadow:none}
  .sbar{display:none}
  #app{inset:0}
  .mob-only{display:inline-flex}
}

/* ---------- App (fixed light, mirrors partner app) ---------- */
.app{--w:#FFFFFF;--k:#0F0F10;--m:#6B6B72;--l:#E7E7EA;--s:#F4F4F6;--p:#6E42E5;--ps:#F1ECFE;--g:#07794C;--gs:#E8F5EE;--r:#C4231B;--rs:#FCEBEA;--am:#B26B00;--ams:#FFF4DE;--bl:#1F5FBF;--bls:#E8F0FD;--hl:#F29D12;
  height:100%;display:flex;flex-direction:column;background:var(--w);color:var(--k);font-family:var(--f-app);font-size:13.5px;position:relative;letter-spacing:-.005em}
.a-head{flex-shrink:0;background:var(--w)}
.a-body{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}

.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;position:relative;flex-shrink:0}
.pill,.emg,.hbtn{border:1px solid var(--l);border-radius:10px;padding:7px 10px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.hbtn{font-weight:500}
.bell{border:1px solid var(--l)} .bell i{position:absolute;top:-6px;right:-6px;background:var(--p);color:#fff;font-style:normal;font-size:9.5px;font-weight:600;border-radius:999px;min-width:17px;height:17px;display:grid;place-items:center}
.banner{background:#FFEDE0;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner b{display:block;font-size:15.5px;font-weight:600}
.banner span{font-size:13px;font-weight:500}
.sun{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 60%,#FFB21A 52%,transparent 53%);flex-shrink:0;position:relative}
.sun::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:10px;background:#FFEDE0}
.avail{display:flex;gap:26px;padding:14px 16px;align-items:center;border-bottom:8px solid var(--s)}
.avail div b{display:block;font-size:13px;font-weight:600}
.avail div span{font-size:9.5px;font-weight:600;letter-spacing:.04em}
.avail .ok{color:var(--g)} .avail .no{color:var(--m)}
.avail .ib{margin-left:auto}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:20px 16px;font-size:16px;font-weight:600;gap:10px}
.row small{display:block;font-size:12.5px;font-weight:500;color:var(--m);margin-top:3px}
.sepb{border-bottom:8px solid var(--s)}

.ql{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tabs{display:flex;border-bottom:1px solid var(--l);overflow-x:auto;scrollbar-width:none}

.mut{color:var(--m)} .sm{font-size:12px}
.num{font-variant-numeric:tabular-nums}

.obtn{border:1px solid var(--l);border-radius:8px;padding:10px 14px;font-weight:500;font-size:13.5px;background:var(--w)}
.box{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}

.box.am{background:var(--ams);color:#5C3A00} .box.gr{background:var(--gs);color:#064A30} .box.rd{background:var(--rs);color:#7A1510} .box.bl{background:var(--bls);color:#123D7A} .box.ps{background:var(--ps);color:#3B1F9A} .box.gy{background:var(--s);color:#333}
.stack{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;width:100%;font-size:14px;border-bottom:1px solid var(--l)}
.task:last-child{border-bottom:0}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #B8B8C0;display:grid;place-items:center;flex-shrink:0;color:#fff}

.oosrow{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px dashed #C7B8F5;background:var(--ps);border-radius:12px;padding:12px 14px;width:100%}

.ph{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:10px;font-weight:500;color:#fff;background:linear-gradient(135deg,#8E9AA6,#5F6B77);position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.12) 22px 24px),repeating-linear-gradient(0deg,transparent 0 22px,rgba(255,255,255,.12) 22px 24px)}
.ph.b2{background:linear-gradient(135deg,#9AA59B,#66735F)} .ph.b3{background:linear-gradient(135deg,#A89B8E,#6F6255)}
.ph span{position:relative}
.ph.add{background:var(--w);border:1.5px dashed #B9A8F3;color:var(--p);align-items:center;justify-content:center;gap:4px;font-size:12px}
.ph.add::before{display:none}
textarea.in,input.in{width:100%;border:1px solid #D4D4DA;border-radius:10px;padding:12px;font:inherit;font-size:14.5px;color:var(--k);background:var(--w);resize:none}
textarea.in{min-height:84px}
.otp{font-size:28px;letter-spacing:.6em;text-align:center;font-weight:600;padding:12px 0 12px .6em;font-variant-numeric:tabular-nums}
.err{color:var(--r);font-size:12.5px;font-weight:500}
.demo{border:1.5px dashed #C9A054;background:#FFFBF2;border-radius:12px;padding:12px 14px}
.demo .dl{font-size:10px;font-weight:700;letter-spacing:.08em;color:#8A5A00;text-transform:uppercase;margin-bottom:6px;font-family:var(--f-body)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--l);display:grid;place-items:center;color:var(--p)}
.qty b{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.addon{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--l)}
.addon b{display:block;font-size:14.5px;font-weight:600}
.addon small{color:var(--m);font-size:12px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px 16px;gap:8px}
.bigic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.bigic.g{background:var(--gs);color:var(--g)} .bigic.a{background:var(--ams);color:var(--am)} .bigic.p{background:var(--ps);color:var(--p)} .bigic.r{background:var(--rs);color:var(--r)}
.kv{width:100%;border:1px solid var(--l);border-radius:12px;padding:6px 14px;text-align:left}
.bn{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--l);padding:6px 0 8px;flex-shrink:0;background:var(--w)}
.bn button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9A9AA2;padding:4px 0;position:relative}
.bn button[aria-current="true"]{color:var(--k);font-weight:500}
.bn .dot{position:absolute;top:0;left:calc(50% + 4px);width:15px;height:15px;border-radius:50%;background:var(--r);color:#fff;font-size:9px;display:grid;place-items:center;font-weight:600}
.helpf{position:absolute;right:14px;bottom:84px;background:#141414;color:#fff;border-radius:999px;padding:9px 14px;font-weight:500;display:flex;gap:6px;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
/* list rows */
.lr{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 16px;border-bottom:1px solid var(--l);text-align:left}
.lr .t{display:block;font-size:14px}
.lr .s{display:block;font-size:12px;color:var(--m);margin-top:3px}
.lr .v{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.lr .r{display:flex;align-items:center;gap:8px}
.lr.tight{padding:12px 0}
.green{color:var(--g)} .red{color:var(--r)} .amber{color:var(--am)} .purple{color:var(--p)}
/* accordion */
.acc{border-bottom:1px solid var(--l)}
.acc>button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;gap:12px;font-size:13.5px;line-height:1.4}
.acc>button svg{flex-shrink:0;transition:transform .2s}
.acc.open>button svg{transform:rotate(180deg)}
.acc .ans{padding:0 0 14px;color:var(--m);font-size:12.5px;line-height:1.6}
.acc .ans ul{margin:0;padding-left:0;list-style:none}
/* toggle */
.tgl{width:40px;height:24px;border-radius:999px;background:#D4D4D8;position:relative;flex-shrink:0;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tgl.on{background:#0E7A4E} .tgl.on::after{left:19px}
/* calendar */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.mhead b{font-size:15px;font-weight:600}
.circ{width:34px;height:34px;border-radius:50%;border:1px solid var(--l);display:grid;place-items:center}
.circ.dis{opacity:.35}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 10px;row-gap:4px}
.cgrid .dow{text-align:center;font-size:12px;font-weight:500;padding:8px 0}
.cday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:8px;font-size:13px;min-height:48px}
.cday.today{background:#EFEFF1}
.cday.other{color:#C5C5CB}
.cday.other .ci{opacity:.45}
.cday.dis{color:#C5C5CB;cursor:default}
.cday.picked{background:#EFEFF1;font-weight:600;color:var(--k)}
.cday.inrange{background:#F6F2FF}
.ci{height:14px;display:grid;place-items:center}
.gloss{padding:0 16px}
.gl-item{display:flex;gap:12px;align-items:center;padding:6px 0;font-size:12.5px}
.gl-item span:first-child{width:22px;display:grid;place-items:center}
.brk{padding:16px;border-top:8px solid var(--s)}
.brk h4{margin:0 0 10px;font-size:15px;font-weight:600}
.brk .n{font-size:17px;font-weight:600} .brk .ns{font-size:11.5px;color:var(--m)}
.brk .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.emgrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 16px;border-top:1px solid var(--l);font-size:13.5px}
.emgrow span{display:flex;gap:10px;align-items:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sd{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:8px;font-size:10px;color:var(--m)}
.sd b{font-size:14px;color:var(--k);font-weight:500}
.sd.sel{background:#EFEFF1;border:1px solid #DADADF}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1.5px solid #3A3A40;border-radius:8px;padding:12px;background:#F5F5F6;min-height:52px}
.slot.off{background:#fff;border-color:#3A3A40}
.slot.peak.on{background:#EAF6EF}
.slot .pk{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.03em;color:#0E7A4E;margin-bottom:3px}
.slot.peak.off .pk{color:var(--r)}
.slot .tm{font-size:13px;font-weight:600}
.slot .job{font-size:11px;color:#333;margin-bottom:3px}
.slot.ro{background:#fff;border-color:#C9C9CF}
.slist{display:flex;flex-direction:column;gap:10px;padding:4px 16px 16px}
.dayh{padding:8px 16px 8px}
.dayh b{font-size:16px;font-weight:600;display:block}
.dayh span{font-size:12.5px}
.selbox{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid #D4D4DA;border-radius:8px;padding:12px;font-size:13.5px}
.fl{font-size:12px;font-weight:500;margin:14px 0 6px}
.statusline{background:#F1F1F3;text-align:center;font-size:11.5px;padding:8px;color:#444}
.statusline.okk{background:#EAF6EF;color:#0E7A4E}
.statusline.bad{background:var(--rs);color:var(--r)}
.rcard{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid #CFCFD4;border-radius:8px;padding:14px;font-size:13.5px}
.rcard.sel{border-color:var(--k);border-width:2px}
.bul{margin:0;padding:0 0 0 4px;list-style:none;display:flex;flex-direction:column;gap:12px}
.bul li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:12.5px;line-height:1.5}
.bul li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k);margin:7px 0 0 4px}
.slider{position:relative;height:48px;border-radius:8px;background:#E4E4E7;color:#9A9AA2;display:flex;align-items:center;justify-content:center;font-weight:500;user-select:none;touch-action:none;overflow:hidden}
.slider.ready{background:#4B2BB8;color:#fff}
.slider .knob{position:absolute;left:4px;top:4px;bottom:4px;width:40px;border-radius:6px;background:#6E42E5;display:grid;place-items:center;color:#fff;cursor:grab;touch-action:none}
.slider:not(.ready) .knob{display:none}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.12);width:0}
/* target */
.rankc{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 12px}
.rankc .d{font-size:11.5px;color:var(--m)}
.rankc h3{margin:4px 0 6px;font-size:21px;font-weight:600}
.gbanner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0E7A4E;color:#fff;border-radius:8px;padding:12px 14px;margin:0 16px 16px;width:calc(100% - 32px);font-size:13px;line-height:1.4}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 8px;align-items:start}
.mcard{border:1px solid var(--l);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:104px}
.mcard b{font-size:13px;font-weight:500;line-height:1.3}
.mcard small{font-size:10.5px;color:var(--m)}
.mcard .v{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600;margin-top:auto;padding-top:8px}
.tier{display:flex;align-items:center;gap:12px;padding:6px 0;font-size:12.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;border:1px solid var(--l);border-radius:8px;padding:8px 10px;font-size:12px;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:var(--k);border-width:1.5px;font-weight:500}
.rchips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.rchips span{width:34px;height:32px;border-radius:6px;background:#EAF6EF;color:#0E7A4E;display:grid;place-items:center;font-size:12px;font-weight:600}
.rchips span.bad{background:#FCEBEA;color:var(--r)}
.rv{display:flex;gap:12px;align-items:center;padding:12px 16px}
.av{width:34px;height:34px;border-radius:4px;background:#D9D9DE;display:grid;place-items:end center;overflow:hidden;flex-shrink:0}
.av::after{content:"";width:22px;height:24px;background:#fff;border-radius:11px 11px 0 0;margin-bottom:-6px}
.rtbl{overflow-x:auto;padding:0 16px}
.rtbl table{width:100%;border-collapse:collapse;font-size:11px;text-align:center;min-width:320px}
.rtbl td,.rtbl th{padding:10px 4px;vertical-align:top}
.rtbl th{font-weight:600;font-size:12.5px}
.rtbl td b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.rtbl td span{color:var(--m);font-size:10.5px}
.rtbl .rl{text-align:left;font-size:12.5px;color:var(--k);width:36%}
.hint-foot{background:#F4F4F6;padding:24px 16px 30px;color:#8A8A92;font-size:12px;line-height:1.5}
.hint-foot b{display:block;color:#6A6A72;font-size:13px;margin:8px 0 4px;font-weight:600}
/* money */
.mcardg{background:#E9F6EF;border-radius:12px;margin:0 16px;padding:14px 14px 10px;width:calc(100% - 32px);text-align:left;display:block}
.mcardg .top{display:flex;justify-content:space-between;align-items:center}
.mcardg b{font-size:19px;font-weight:600;color:#0E6B43}
.mcardg small{display:block;font-size:11.5px;font-weight:500;color:#0E3B27;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:12px}
.bars .bw{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .b{width:100%;background:#8FD3AE;border-radius:2px 2px 0 0}
.bars .bw.cur .b{background:#0E9A5C}
.bars .bw span{font-size:10.5px;color:#555}
.bars .bw.cur span{font-weight:600;color:#111;border-bottom:2px solid #0E9A5C}
.bars.track .bw .tr{width:100%;flex:1;background:#EDEDF0;display:flex;align-items:flex-end;border-radius:2px}
.bars.track .bw .tr .b{background:#8FD3AE}
.bars.track .bw.cur .tr .b{background:#0E9A5C}
.hs{display:flex;gap:10px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.btc{flex:0 0 120px;border:1px solid var(--l);border-radius:8px;padding:12px;text-align:left}
.btc b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.btc small{display:block;font-size:11.5px;color:var(--m);margin:4px 0 12px}
.btc i{font-style:normal;font-size:11px;font-weight:600}
.irow{display:flex;gap:14px;align-items:center;width:100%;padding:14px 16px;text-align:left}
.irow .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:#F4F4F6;color:#444}
.irow .t{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.irow .v{font-size:14px;font-weight:600;margin-top:2px}
.irow .grow{flex:1}
.eline{display:flex;gap:14px;align-items:center;width:100%;padding:16px;text-align:left}
.eline .ico{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.eline b{font-size:15px;font-weight:600;display:block}
.eline small{font-size:12px;color:var(--m)}
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.pcards button{border:1px solid var(--l);border-radius:8px;padding:12px 10px;text-align:left;font-size:11.5px;color:var(--m);display:flex;flex-direction:column;gap:4px}
.pcards button b{font-size:14px;color:var(--k);font-weight:600;margin-top:6px}
.tp{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 32px);margin:14px 16px;background:#F1F1F3;border-radius:8px;padding:12px 14px;text-align:left}
.tp b{display:block;font-size:13.5px;font-weight:600}
.tp small{font-size:12px;color:#555}
.credhero{background:linear-gradient(180deg,#8EE4EA 0%,#DDF8FA 100%);height:150px;position:relative;overflow:hidden}
.credhero .coin{position:absolute;right:40px;top:26px;width:110px;height:90px}
.credhero .ib{position:absolute;left:12px;top:10px;background:#fff;border-radius:50%;width:32px;height:32px}
/* sheets & toasts */
.scrim{position:absolute;inset:0;background:rgba(10,10,20,.62);z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--w);border-radius:14px 14px 0 0;padding:20px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative;max-height:88%;overflow:visible}
.sheet .sb{overflow-y:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
button.cday:disabled{cursor:default}
.sheet h3{margin:0;font-size:17px;font-weight:600;line-height:1.35}
.sheet p{margin:0;color:var(--m);line-height:1.5;font-size:13px}
.sx{position:absolute;right:14px;top:-46px;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111}
.qmark{width:36px;height:36px;border-radius:50%;background:#F37A2A;color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.xmark{width:44px;height:44px;border-radius:50%;background:#D7261E;color:#fff;display:grid;place-items:center;font-weight:700;font-size:26px}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:#1C1B22;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;z-index:40;max-width:86%;text-align:center;line-height:1.4;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* drawer */
.drawer{position:absolute;inset:0;z-index:25;display:flex}
.drawer .dp{width:86%;max-width:330px;background:#fff;height:100%;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,.2)}
.drawer .dr{flex:1;background:rgba(10,10,20,.5)}
.prof{display:flex;justify-content:space-between;gap:10px;padding:18px 16px;border-bottom:8px solid var(--s)}
.prof h3{margin:0;font-size:19px;font-weight:600;line-height:1.25}
.prof .ph2{width:64px;height:72px;border-radius:6px;background:linear-gradient(180deg,#3A3A42,#1C1C22);flex-shrink:0;position:relative;overflow:hidden}
.prof .ph2::after{content:"";position:absolute;left:50%;top:14px;width:26px;height:30px;border-radius:50%;background:#B98A6B;transform:translateX(-50%);box-shadow:0 34px 0 10px #111}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;font-size:13.5px;font-weight:500}
.mi .grow{flex:1}
.mi small{display:block;font-weight:400;color:var(--m);font-size:11.5px}
/* coach highlight */
.hl{outline:3px solid var(--hl)!important;outline-offset:-2px;border-radius:10px;animation:ring 1.4s ease-out infinite;position:relative;z-index:2}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(242,157,18,.55)}100%{box-shadow:0 0 0 14px rgba(242,157,18,0)}}
.nudge{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ov{position:absolute;inset:0;z-index:30;background:rgba(21,18,31,.72);display:flex;align-items:flex-end}
.ovc{background:var(--panel);color:var(--ink);width:100%;border-radius:22px 22px 0 0;padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-body);max-height:92%;overflow-y:auto}
.ovc .lbl{color:var(--coach)}
.ovc h3{font-family:var(--f-disp);font-size:23px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ovc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ovc li{display:grid;grid-template-columns:22px 1fr;gap:8px;line-height:1.4;font-size:14.5px}
.ovc li i{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.ovc .row2{display:flex;gap:10px;flex-wrap:wrap}
.btnp{flex:1;min-width:140px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
.btns2{flex:1;min-width:120px;height:48px;border-radius:12px;border:1px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center}
.medal{width:56px;height:56px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center}
@media (prefers-reduced-motion: reduce){.hl{animation:none}.nudge{animation:none}.toast{animation:none}.a-body{scroll-behavior:auto}}

/* calls & chat */
.call{position:absolute;inset:0;background:linear-gradient(180deg,#221E34,#0E0C16);color:#fff;display:flex;flex-direction:column;z-index:15;font-family:var(--f-app)}
.call .ch{text-align:center;padding:26px 16px 12px}
.call .ch .av2{width:70px;height:70px;border-radius:50%;background:#6E42E5;display:grid;place-items:center;margin:0 auto 10px;font-weight:700;font-size:20px}
.call .ch .av2.red{background:#D7261E}
.call .ch .av2.green{background:#0E7A4E}
.call .ch b{display:block;font-size:18px;font-weight:600}
.call .ch small{color:#B9B4CC;font-size:12px}
.call .tr{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.bub.ai{background:#2E2A45;align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:#6E42E5;align-self:flex-end;border-top-right-radius:4px}

li ({#} Oct–{#} Nov); those days become leave": "দিওয়ালিতে ({#} অক্টোবর–{#} নভেম্বর) ব্রেক বন্ধ; ওই দিনগুলো ছুটি হয়ে যায়", "By continuing, you consent to UC receiving your Aadhaar details (name, date of birth, address, photo) through UIDAI, only to verify your identity. You can withdraw consent by writing to privacy@urbancompany.com.": "এগিয়ে গেলে আপনি সম্মতি দিচ্ছেন যে UC শুধু আপনার পরিচয় যাচাই করতে UIDAI থেকে আপনার আধারের তথ্য (নাম, জন্মতারিখ, ঠিকানা, ছবি) নেবে। privacy@urbancompany.com-এ লিখে আপনি সম্মতি তুলে নিতে পারেন।", "Cancelled: customer not reachable. ₹{#} compensation will be credited to your bank. Not counted as a cancellation.": "ক্যানসেল: কাস্টমারকে পাওয়া যায়নি। ₹{#} ক্ষতিপূরণ আপনার ব্যাংকে জমা হবে। ক্যানসেলেশন হিসেবে গোনা হবে না।", "Cancelling yourself counts as a cancellation. Take Help first.": "নিজে ক্যানসেল করলে ক্যানসেলেশন গোনা হয়। আগে Help নিন।", "Challenge accepted. This cancellation is removed from your Target metrics.": "চ্যালেঞ্জ মেনে নেওয়া হয়েছে। এই ক্যানসেলেশন আপনার টার্গেট মেট্রিক্স থেকে সরানো হয়েছে।", "Changing the phone number needs identity verification, which a support agent does. Shall I connect you to an agent?": "ফোন নম্বর বদলাতে পরিচয় যাচাই লাগে, যেটা সাপোর্ট এজেন্ট করেন। আপনাকে একজন এজেন্টের সাথে যোগ করে দেব?", "Check the metric criteria for the rank by clicking on view details on the target screen. At your next review date, if all your metrics satisfy the criteria for this rank, your rank will be increased.": "টার্গেট স্ক্রিনে view details ক্লিক করে র‍্যাঙ্কের মেট্রিক্সের শর্তগুলো দেখুন। পরের রিভিউয়ের দিন আপনার সব মেট্রিক্স এই র‍্যাঙ্কের শর্ত পূরণ করলে আপনার র‍্যাঙ্ক বাড়বে।", "Contact us → Call Support. An AI assistant answers first. If it cannot solve your issue, it connects you to a support agent (CX-PX).": "Contact us → Call Support। প্রথমে একটা AI অ্যাসিস্ট্যান্ট উত্তর দেয়। সমস্যার সমাধান না করতে পারলে আপনাকে সাপোর্ট এজেন্টের (CX-PX) সাথে যোগ করে দেয়।", "Could not send (no internet?). It will retry next time you open the app. Show this screen to your trainer.": "পাঠানো যায়নি (ইন্টারনেট নেই?)। পরের বার অ্যাপ খুললে আবার চেষ্টা হবে। এই স্ক্রিনটা আপনার ট্রেনারকে দেখান।", "Credits are used to buy leads (jobs). \"Added from payout\" means UC recharged your credits from your weekly payout ({#} credit = ₹{#}).": "ক্রেডিট দিয়ে লিড (জব) কেনা হয়। \"Added from payout\" মানে UC আপনার সাপ্তাহিক পেআউট থেকে ক্রেডিট রিচার্জ করেছে ({#} ক্রেডিট = ₹{#})।", "Customer not reachable after {#} calls at the booking location. ₹{#} will be credited to your bank account as compensation and this cancellation will not be counted.": "বুকিংয়ের লোকেশনে {#}বার কল করার পরেও কাস্টমারকে পাওয়া যায়নি। ক্ষতিপূরণ হিসেবে ₹{#} আপনার ব্যাংক অ্যাকাউন্টে জমা হবে আর এই ক্যানসেলেশন গোনা হবে না।", "Do not cancel the job yourself. After the report, the team talks to the customer and decides.": "নিজে জব ক্যানসেল করবেন না। রিপোর্টের পরে টিম কাস্টমারের সাথে কথা বলে ঠিক করবে।", "Easy-order lets you order products now. The amount is recovered from your job payouts (shown as \"Pending for products\" in your weekly settlement).": "Easy order দিয়ে এখনই প্রোডাক্ট অর্ডার করা যায়। টাকাটা আপনার জবের পেআউট থেকে কাটা হয় (সাপ্তাহিক সেটেলমেন্টে \"Pending for products\" হিসেবে দেখায়)।", "Emergency break is only for today or tomorrow, twice per cycle": "ইমার্জেন্সি ব্রেক শুধু আজ বা কালকের জন্য, প্রতি সাইকেলে দুবার", "Emergency break taken for {#} September. Remaining jobs cancelled with no penalty.": "{#} সেপ্টেম্বরের জন্য ইমার্জেন্সি ব্রেক নেওয়া হয়েছে। বাকি জবগুলো পেনাল্টি ছাড়া ক্যানসেল হয়েছে।", "Guarantee depends on rank: Gold/Diamond ₹{#}, Silver ₹{#}, Bronze ₹{#}": "গ্যারান্টি র‍্যাঙ্কের উপর নির্ভর করে: গোল্ড/ডায়মন্ড ₹{#}, সিলভার ₹{#}, ব্রোঞ্জ ₹{#}", "Higher rank = bigger guarantee, loans, insurance, longer pause cover": "বড় র‍্যাঙ্ক = বেশি গ্যারান্টি, লোন, ইনস্যুরেন্স, বেশি দিনের পজ কভার", "I can see the Esha Saini job on {#} Sep was counted as a cancellation because it was cancelled from your side. If you think this is wrong, I can connect you to an agent to check.": "দেখছি {#} সেপ্টেম্বরের Esha Saini-র জবটা ক্যানসেলেশন হিসেবে গোনা হয়েছে, কারণ এটা আপনার দিক থেকে ক্যানসেল হয়েছিল। আপনার যদি মনে হয় এটা ভুল, আমি একজন এজেন্টের সাথে যোগ করে দিতে পারি, তিনি চেক করবেন।", "I checked the call records. The customer did not answer your calls, so this is not your fault. I have raised a Cancellation Penalty Challenge. You will get the result within {#} hours.": "আমি কলের রেকর্ড দেখেছি। কাস্টমার আপনার কল ধরেননি, তাই এটা আপনার দোষ নয়। আমি Cancellation Penalty Challenge করে দিয়েছি। {#} ঘণ্টার মধ্যে ফল পাবেন।", "I have noted it. A team member will call the customer and help you with material.": "আমি লিখে নিয়েছি। টিমের একজন কাস্টমারকে কল করবেন আর মেটেরিয়াল নিয়ে আপনাকে সাহায্য করবেন।", "I have verified your Aadhaar and old number. I have raised the number change request. Your new number will work for login within {#} hours, and you will get an SMS.": "আমি আপনার আধার আর পুরোনো নম্বর যাচাই করেছি। নম্বর বদলের রিকোয়েস্ট করে দিয়েছি। {#} ঘণ্টার মধ্যে নতুন নম্বর দিয়ে লগইন করা যাবে, আর আপনি একটা SMS পাবেন।", "If a deduction (loan EMI, product or penalty) cannot be recovered from a payout, it shows here and is recovered from your next payout.": "কোনো কাটা টাকা (লোনের EMI, প্রোডাক্ট বা পেনাল্টি) পেআউট থেকে কাটা না গেলে সেটা এখানে দেখায়, আর পরের পেআউট থেকে কাটা হয়।", "If the customer wants to reschedule, they do it from their app": "কাস্টমার সময় বদলাতে চাইলে নিজের অ্যাপ থেকে বদলান", "If you are in bronze or silver rank, this rank will be applicable to you for {#} days until your next review cycle. If you are a gold partner, this rank will be applicable to you for {#} days, until your next review cycle. If you are a Diamond partner, this rank will be applicable to you for {#} days.": "আপনি ব্রোঞ্জ বা সিলভার র‍্যাঙ্কে থাকলে, পরের রিভিউ সাইকেল পর্যন্ত {#} দিন এই র‍্যাঙ্ক থাকবে। আপনি গোল্ড পার্টনার হলে, পরের রিভিউ সাইকেল পর্যন্ত {#} দিন এই র‍্যাঙ্ক থাকবে। আপনি ডায়মন্ড পার্টনার হলে, {#} দিন এই র‍্যাঙ্ক থাকবে।", "If you earn less, you get {#}% of the gap; a paused profile gets rejected": "কম আয় হলে ঘাটতির {#}% পাবেন; পজ হওয়া প্রোফাইল বাদ যায়", "If you ever collect cash from a customer, it is adjusted here from your payout.": "কখনও কাস্টমারের কাছ থেকে ক্যাশ নিলে, সেটা এখানে আপনার পেআউট থেকে মিলিয়ে নেওয়া হয়।", "In the real app, GPS checks you are at the customer location at booking time.": "আসল অ্যাপে GPS দেখে নেয় আপনি বুকিং সময়ে কাস্টমারের লোকেশনে আছেন কিনা।", "It is raining heavily here. Sharing a video so you can decide.": "এখানে খুব জোরে বৃষ্টি হচ্ছে। ভিডিও পাঠাচ্ছি, আপনি ঠিক করুন।", "It is raining very heavily and UC has sent an alert. Cancel today's job without penalty.": "খুব জোরে বৃষ্টি হচ্ছে আর UC অ্যালার্ট পাঠিয়েছে। আজকের জব পেনাল্টি ছাড়া ক্যানসেল করুন।", "Know what happens when your targets are below minimum rank requirements": "আপনার টার্গেট র‍্যাঙ্কের ন্যূনতম শর্তের নিচে গেলে কী হয় জেনে নিন", "Leave the place right now. Do not argue. The safety team has your location and will call you in {#} minutes. You will not be penalised for leaving.": "এখনই জায়গাটা ছেড়ে চলে যান। তর্ক করবেন না। সেফটি টিমের কাছে আপনার লোকেশন আছে, {#} মিনিটের মধ্যে আপনাকে কল করবে। চলে যাওয়ার জন্য কোনো পেনাল্টি হবে না।", "Missing even Bronze gives a profile strike; {#} in {#} months = removal": "ব্রোঞ্জও না পেলে প্রোফাইল স্ট্রাইক হয়; {#} মাসে {#}টা = প্ল্যাটফর্ম থেকে বাদ", "Move to a safe place and sit down. I have alerted the UC safety team and shared your location. They will call you within {#} minutes. Your job is on hold and there is no penalty. Your insurance covers minor accident treatment.": "নিরাপদ জায়গায় গিয়ে বসুন। আমি UC সেফটি টিমকে জানিয়েছি আর আপনার লোকেশন শেয়ার করেছি। {#} মিনিটের মধ্যে ওঁরা আপনাকে কল করবেন। আপনার জব আপাতত থেমে আছে, কোনো পেনাল্টি নেই। ছোটখাটো দুর্ঘটনার চিকিৎসা আপনার ইনস্যুরেন্সে কভার হয়।", "Namaste {name}! I am UC's AI assistant. Please tell me your issue.": "নমস্কার {name}! আমি UC-র AI অ্যাসিস্ট্যান্ট। আপনার সমস্যাটা বলুন।", "Need to change your phone number? It cannot be edited here. Go to Help → Contact us → Call Support and ask for a number change.": "ফোন নম্বর বদলাতে চান? এখানে এডিট করা যায় না। Help → Contact us → Call Support-এ গিয়ে নম্বর বদলের কথা বলুন।", "Net Earnings = Total Earnings − Total Deductions. Deductions are what you pay to UC (commission, service charge, material) and to the government (GST, TDS).": "নেট আয় = মোট আয় − মোট কাটা টাকা। কাটা টাকা হলো যা আপনি UC-কে দেন (কমিশন, সার্ভিস চার্জ, মেটেরিয়াল) আর সরকারকে দেন (GST, TDS)।", "No hints in the test. Do it the way you will do it on a real job.": "টেস্টে কোনো হিন্ট নেই। আসল জবে যেভাবে করবেন, সেভাবেই করুন।", "On weekdays, {#} AM–{#} PM and {#} PM–{#} PM are peak slots ({#} hours a day). Every peak hour you do not mark available is added here. Break days are not counted.": "সপ্তাহের দিনে {#} AM–{#} PM আর {#} PM–{#} PM পিক স্লট (দিনে {#} ঘণ্টা)। যে পিক ঘণ্টা আপনি অ্যাভেলেবল মার্ক করেন না, সেটা এখানে যোগ হয়। ব্রেকের দিন গোনা হয় না।", "On {#} October you are not free from {#} to {#} AM. Turn off only that slot and save the calendar.": "{#} অক্টোবর আপনি {#} থেকে {#} AM ফ্রি নন। শুধু ওই স্লটটা বন্ধ করে ক্যালেন্ডার সেভ করুন।", "One or more metrics were outside your rank limit in this cycle, so the guarantee did not apply.": "এই সাইকেলে এক বা একাধিক মেট্রিক্স আপনার র‍্যাঙ্কের সীমার বাইরে ছিল, তাই গ্যারান্টি লাগু হয়নি।", "Only cancel jobs in emergency situations. If an incorrect cancellation is marked against you, please visit the help center to resolve it.": "শুধু ইমার্জেন্সিতেই জব ক্যানসেল করুন। ভুল করে আপনার নামে ক্যানসেলেশন গোনা হলে, সমাধানের জন্য হেল্প সেন্টারে যান।", "Only {#} hours were marked available. Minimum {#} hours are required, so you were not eligible.": "মাত্র {#} ঘণ্টা অ্যাভেলেবল মার্ক করা ছিল। কমপক্ষে {#} ঘণ্টা লাগে, তাই আপনি যোগ্য ছিলেন না।", "Open the job from Target → Cancellations and tap \"Need help?\"": "টার্গেট → Cancellations থেকে জবটা খুলে \"Need help?\" ট্যাপ করুন", "Opens Cleartax \"Tax Wapsi\" WhatsApp ITR filing in the browser": "ব্রাউজারে Cleartax \"Tax Wapsi\" WhatsApp ITR ফাইলিং খোলে", "Paid to UC = commission + service charge + material auto-replenishment": "Paid to UC = কমিশন + সার্ভিস চার্জ + মেটেরিয়ালের অটো-রিপ্লেনিশমেন্ট", "Pari Sharma sees: \"Your professional added work worth ₹{#}. Approve?\"": "Pari Sharma দেখেন: \"Your professional added work worth ₹{#}. Approve?\"", "Part of the payout recharges credits (wallet); the rest goes to bank": "পেআউটের একটা অংশ দিয়ে ক্রেডিট (ওয়ালেট) রিচার্জ হয়; বাকিটা ব্যাংকে যায়", "Payment history shows each recovery attempt. \"Payment failed\" means there was not enough payout that week; the amount moves to your next payout.": "পেমেন্ট হিস্ট্রিতে প্রতিবার টাকা কাটার চেষ্টা দেখায়। \"Payment failed\" মানে সেই সপ্তাহে যথেষ্ট পেআউট ছিল না; টাকাটা পরের পেআউটে চলে যায়।", "Peak hour slot: {#} AM–{#} PM and {#}–{#} PM on weekdays, all slots on weekends": "পিক আওয়ার স্লট: সপ্তাহের দিনে {#} AM–{#} PM আর {#}–{#} PM, উইকেন্ডে সব স্লট", "Pending deductions show amounts not yet recovered from payouts": "বাকি কাটা টাকায় সেই টাকা দেখায় যা পেআউট থেকে এখনও কাটা হয়নি", "Practice only. No real job, payment, ticket, calendar change or call is created. Names, amounts and some rules are sample data.": "শুধু প্র্যাকটিস। কোনো আসল জব, পেমেন্ট, টিকিট, ক্যালেন্ডার বদল বা কল হয় না। নাম, টাকার অঙ্ক আর কিছু নিয়ম নমুনা তথ্য।", "Practice the UC partner app before your first real job. Mistakes here cost nothing.": "প্রথম আসল জবের আগে UC পার্টনার অ্যাপ প্র্যাকটিস করুন। এখানে ভুল করলে কোনো ক্ষতি নেই।", "Pressing Emergency on Home, Help or the job page triggers an instant call from UC's AI bot.": "হোম, Help বা জবের পেজে ইমার্জেন্সি টিপলে সঙ্গে সঙ্গে UC-র AI বটের কল আসে।", "Profile shows your details; the phone number is changed via Help → Call Support": "প্রোফাইলে আপনার তথ্য দেখায়; ফোন নম্বর বদলাতে হয় Help → Call Support দিয়ে", "Record a video of the rain and send it in the job's customer chat": "বৃষ্টির ভিডিও রেকর্ড করে জবের কাস্টমার চ্যাটে পাঠান", "Saturday and Sunday each have {#} working hours ({#} AM to {#} PM). Every weekend hour you do not mark available on your calendar is added here. Break days are not counted.": "শনি আর রবিবার প্রতিদিন {#} ঘণ্টা কাজের সময় ({#} AM থেকে {#} PM)। উইকেন্ডের যে ঘণ্টা আপনি ক্যালেন্ডারে অ্যাভেলেবল মার্ক করেন না, সেটা এখানে যোগ হয়। ব্রেকের দিন গোনা হয় না।", "Say: \"Namaste, I am your UC professional. I am stuck in traffic and will reach by {#} PM. Sorry for the delay.\"": "বলুন: \"নমস্কার, আমি আপনার UC প্রোফেশনাল। আমি জ্যামে আটকে আছি, {#} PM-এর মধ্যে পৌঁছে যাব। দেরির জন্য দুঃখিত।\"", "So if your job value is less than promised, UC pays {#}% of the difference, which is what you would have earned.": "তাই আপনার জব ভ্যালু কথা দেওয়া টাকার চেয়ে কম হলে, UC পার্থক্যের {#}% দেয়, যেটা আপনি আয় করতেন।", "Sorry, I am running {#} minutes late due to traffic. I will reach by {#} PM.": "দুঃখিত, জ্যামের জন্য আমার {#} মিনিট দেরি হচ্ছে। {#} PM-এর মধ্যে পৌঁছে যাব।", "Start only after the customer approves in their app; never take cash": "কাস্টমার তাঁর অ্যাপে অনুমোদন করার পরেই শুরু করুন; কখনও ক্যাশ নেবেন না", "Start the extra work only after approval. Never take cash for extra work.": "অনুমোদনের পরেই বাড়তি কাজ শুরু করুন। বাড়তি কাজের জন্য কখনও ক্যাশ নেবেন না।", "Stay at the location, call twice, then Cancel Job → Customer is unreachable": "লোকেশনে থাকুন, দুবার কল করুন, তারপর Cancel Job → Customer is unreachable", "Study the tables, then open \"For how long am I in a given rank?\".": "টেবিলগুলো ভালো করে দেখুন, তারপর \"একটা র‍্যাঙ্কে আমি কতদিন থাকব?\" খুলুন।", "Support raised it on your call. You will get the result within {#} hours.": "আপনার কলেই সাপোর্ট এটা করে দিয়েছে। {#} ঘণ্টার মধ্যে ফল পাবেন।", "Take a clear photo of the existing damage with the proofs, so it is not blamed on you later.": "প্রুফের সাথে আগে থেকে থাকা ক্ষতির পরিষ্কার ছবি তুলুন, যাতে পরে আপনার উপর দোষ না পড়ে।", "Take the OTP only from the customer, never share it with anyone else.": "OTP শুধু কাস্টমারের কাছ থেকেই নিন, আর কখনও কাউকে শেয়ার করবেন না।", "Tap the glowing button each time. Read the hint above the phone.": "প্রতিবার জ্বলজ্বলে বোতামটা ট্যাপ করুন। ফোনের উপরের হিন্টটা পড়ুন।", "Tell the customer it is raining heavily, ask if they still want the job today or want to reschedule. Then send a rain video in chat.": "কাস্টমারকে বলুন খুব জোরে বৃষ্টি হচ্ছে, জিজ্ঞেস করুন তিনি আজই জব চান নাকি সময় বদলাতে চান। তারপর চ্যাটে বৃষ্টির ভিডিও পাঠান।", "Thanks for the video. It is really heavy. Let us reschedule to tomorrow.": "ভিডিওর জন্য ধন্যবাদ। সত্যিই খুব জোরে হচ্ছে। চলুন কালকের জন্য সময় বদলে নিই।", "The agent raises a \"Cancellation Penalty Challenge\"; if accepted, the count is removed": "এজেন্ট একটা \"Cancellation Penalty Challenge\" করেন; মেনে নেওয়া হলে গোনা থেকে সরানো হয়", "The booked package cannot be changed here. Add extra work with ADD.": "বুক করা প্যাকেজ এখানে বদলানো যায় না। ADD দিয়ে বাড়তি কাজ যোগ করুন।", "The booked work can't be done (e.g. no water). Tap \"Booked work can't be done?\".": "বুক করা কাজ করা যাচ্ছে না (যেমন জল নেই)। \"বুক করা কাজ করা যাচ্ছে না?\" ট্যাপ করুন।", "The customer pays for the approved extra work in the UC app. Do not take cash.": "অনুমোদিত বাড়তি কাজের টাকা কাস্টমার UC অ্যাপে দেন। ক্যাশ নেবেন না।", "The customer wants more work than booked. What is the right way?": "কাস্টমার বুক করা কাজের চেয়ে বেশি কাজ চান। ঠিক উপায় কোনটা?", "The customer will be told you have arrived. Do not tap this on the way.": "কাস্টমারকে জানানো হবে যে আপনি পৌঁছে গেছেন। রাস্তায় থাকার সময় এটা ট্যাপ করবেন না।", "The customer's number is hidden. Calls and chats go through UC, so always contact the customer from the app.": "কাস্টমারের নম্বর লুকানো থাকে। কল আর চ্যাট UC-র মাধ্যমে হয়, তাই সবসময় অ্যাপ থেকেই কাস্টমারের সাথে যোগাযোগ করুন।", "The job has started, but there is no water in the building, so the booked work cannot be done. Report it correctly in the app.": "জব শুরু হয়ে গেছে, কিন্তু বিল্ডিংয়ে জল নেই, তাই বুক করা কাজ করা যাচ্ছে না। অ্যাপে ঠিকভাবে রিপোর্ট করুন।", "The job is in progress. The customer also wants {#} bathroom exhaust fan cleaned. Add this work in the app and get it approved by the customer.": "জব চলছে। কাস্টমার {#}টা বাথরুমের এগজস্ট ফ্যানও পরিষ্কার করাতে চান। এই কাজটা অ্যাপে যোগ করে কাস্টমারের অনুমোদন নিন।", "The team will review and talk to the customer. You will get a call or app notification.": "টিম দেখে কাস্টমারের সাথে কথা বলবে। আপনি কল বা অ্যাপ নোটিফিকেশন পাবেন।", "The {#}-digit OTP is shown inside the booking in the customer's UC app.": "{#} সংখ্যার OTP কাস্টমারের UC অ্যাপে বুকিংয়ের ভিতরে দেখায়।", "The ☰ menu has profile, calendar, credits, loans, insurance and training": "☰ মেনুতে প্রোফাইল, ক্যালেন্ডার, ক্রেডিট, লোন, ইনস্যুরেন্স আর ট্রেনিং আছে", "Then the \"Cancel\" button shows: you get ₹{#} and it is not counted. Helpline cannot cancel for you": "তারপর \"Cancel\" বোতাম দেখায়: আপনি ₹{#} পাবেন আর এটা গোনা হবে না। হেল্পলাইন আপনার হয়ে ক্যানসেল করতে পারে না", "There is a sudden emergency at home and you cannot work today. Take an emergency break for today.": "বাড়িতে হঠাৎ ইমার্জেন্সি, আজ কাজ করতে পারবেন না। আজকের জন্য ইমার্জেন্সি ব্রেক নিন।", "Think this is wrong? Tap \"Need help?\" below and talk to support. They raise a cancellation challenge for you.": "ভুল মনে হচ্ছে? নিচে \"Need help?\" ট্যাপ করে সাপোর্টের সাথে কথা বলুন। ওঁরা আপনার হয়ে ক্যানসেলেশন চ্যালেঞ্জ করে দেবেন।", "This call is recorded in the app as a call attempt. Wait a few minutes before calling again.": "এই কলটা অ্যাপে কল করার চেষ্টা হিসেবে রেকর্ড হয়েছে। আবার কল করার আগে কয়েক মিনিট অপেক্ষা করুন।", "This is the amount that goes to your bank after deductions and after recharging your wallet (credits).": "কাটা টাকা আর ওয়ালেট (ক্রেডিট) রিচার্জের পরে এই টাকাটা আপনার ব্যাংকে যায়।", "This is UC emergency support. Are you safe? Tell me what happened.": "এটা UC ইমার্জেন্সি সাপোর্ট। আপনি নিরাপদ আছেন তো? কী হয়েছে বলুন।", "To install: open the browser menu (⋮) and tap \"Install app\" or \"Add to Home screen\".": "ইনস্টল করতে: ব্রাউজারের মেনু (⋮) খুলে \"Install app\" বা \"Add to Home screen\" ট্যাপ করুন।", "Today's job was cancelled automatically, no penalty. Tap to see.": "আজকের জব নিজে থেকেই ক্যানসেল হয়েছে, কোনো পেনাল্টি নেই। দেখতে ট্যাপ করুন।", "Total earnings = job value + cancellation incentive + incentive + tip": "মোট আয় = জব ভ্যালু + ক্যানসেলেশন ইনসেনটিভ + ইনসেনটিভ + টিপস", "Try anything. Nothing here affects a real job, payout or calendar.": "যা খুশি চেষ্টা করুন। এখানের কিছুই আসল জব, পেআউট বা ক্যালেন্ডারে প্রভাব ফেলে না।", "Turning off a peak slot ({#}–{#}, {#}–{#}) adds peak unavailable hours": "পিক স্লট ({#}–{#}, {#}–{#}) বন্ধ করলে পিক আনঅ্যাভেলেবল ঘণ্টা যোগ হয়", "UAN is the {#}-digit number on your eShram card, a government ID for workers. It helps you get government welfare schemes.": "UAN হলো আপনার ই-শ্রম কার্ডের {#} সংখ্যার নম্বর, শ্রমিকদের জন্য একটা সরকারি ID। এতে সরকারি কল্যাণ প্রকল্পের সুবিধা পেতে সাহায্য হয়।", "UC commission/service charge, GST/TDS, loan and products (easy-order)": "UC কমিশন/সার্ভিস চার্জ, GST/TDS, লোন আর প্রোডাক্ট (Easy order)", "UC has allowed this job to be cancelled without penalty. Use Cancel Job → Heavy rain.": "UC এই জব পেনাল্টি ছাড়া ক্যানসেল করার অনুমতি দিয়েছে। Cancel Job → Heavy rain ব্যবহার করুন।", "UC matches your selfie with your profile photo. Do not use a photo of a photo.": "UC আপনার সেলফি প্রোফাইলের ছবির সাথে মিলিয়ে দেখে। ছবির ছবি তুলবেন না।", "UC sent a heavy rain alert for your area. This job will be cancelled without penalty and will not be counted. The customer will be informed.": "UC আপনার এলাকার জন্য ভারী বৃষ্টির অ্যালার্ট পাঠিয়েছে। এই জব পেনাল্টি ছাড়া ক্যানসেল হবে, গোনা হবে না। কাস্টমারকে জানিয়ে দেওয়া হবে।", "Under \"Bank transfers\", open the {#} - {#} Sep upcoming card.": "\"Bank transfers\"-এর নিচে {#} - {#} Sep-এর আসন্ন কার্ডটা খুলুন।", "Under earning guarantee, if you earn less than promised, how much does UC pay?": "আয়ের গ্যারান্টিতে কথা দেওয়া টাকার চেয়ে কম আয় হলে UC কত দেয়?", "Unmarked weekday {#}–{#} and {#}–{#} hours are peak unavailable hours": "সপ্তাহের দিনে {#}–{#} আর {#}–{#}-এর মার্ক না করা ঘণ্টা পিক আনঅ্যাভেলেবল ঘণ্টা", "Urban Company does not increase or decrease your rating. Only customers can give you ratings.": "Urban Company আপনার রেটিং বাড়ায় বা কমায় না। শুধু কাস্টমাররাই আপনাকে রেটিং দিতে পারেন।", "Wear your UC uniform. Your face should be clearly visible in good light.": "UC ইউনিফর্ম পরুন। ভালো আলোয় আপনার মুখ পরিষ্কার দেখা যাওয়া চাই।", "What happens if you switch off a peak slot ({#}–{#} or {#}–{#})?": "পিক স্লট ({#}–{#} বা {#}–{#}) বন্ধ করলে কী হয়?", "When does the customer's rating start showing in the profile?": "কাস্টমারের দেওয়া রেটিং প্রোফাইলে কখন দেখা যায়?", "You already have a job for this slot, so it cannot be unmarked.": "এই স্লটে আপনার আগে থেকেই জব আছে, তাই আনমার্ক করা যাবে না।", "You applied for a break on this day. It does not count in unavailable hours.": "এই দিনের জন্য আপনি ব্রেকের আবেদন করেছেন। এটা আনঅ্যাভেলেবল ঘণ্টায় গোনা হয় না।", "You can order material instantly from Menu → UC shop → Easy order; the amount is recovered from your payout. Meanwhile, finish the rest of the work and tell the customer. Does this solve your issue?": "Menu → UC শপ → Easy order থেকে সঙ্গে সঙ্গে মেটেরিয়াল অর্ডার করতে পারেন; টাকাটা আপনার পেআউট থেকে কাটা হবে। এর মধ্যে বাকি কাজটা শেষ করুন আর কাস্টমারকে জানান। এতে আপনার সমস্যার সমাধান হলো?", "You cannot opt out. All your recent customer leads are from your serviceable hubs.": "আপনি বাদ দিতে পারবেন না। আপনার সাম্প্রতিক সব কাস্টমার লিড আপনার সার্ভিস দেওয়ার হাব থেকেই এসেছে।", "You get a profile strike if your metrics don't meet bronze rank criteria at the review date. Your jobs will be paused, and you will have to undergo training with the trainer to understand how to improve your performance. If you get {#} profile strikes in {#} months, you can be permanently removed from the platform.": "রিভিউয়ের দিন আপনার মেট্রিক্স ব্রোঞ্জ র‍্যাঙ্কের শর্ত পূরণ না করলে প্রোফাইল স্ট্রাইক হয়। আপনার জব বন্ধ থাকবে, আর কীভাবে কাজ ভালো করবেন বুঝতে ট্রেনারের সাথে ট্রেনিং করতে হবে। {#} মাসে {#}টা প্রোফাইল স্ট্রাইক হলে আপনাকে প্ল্যাটফর্ম থেকে চিরকালের মতো বাদ দেওয়া হতে পারে।", "You got injured while working. Get emergency help from the app right away.": "কাজ করতে গিয়ে আপনি চোট পেয়েছেন। এখনই অ্যাপ থেকে ইমার্জেন্সি সাহায্য নিন।", "You have reached the customer (Pari Sharma) for the {#} PM job. Start the job in the app. The customer told you the OTP: {#}.": "{#} PM-এর জবের জন্য আপনি কাস্টমারের (Pari Sharma) কাছে পৌঁছে গেছেন। অ্যাপে জব শুরু করুন। কাস্টমার আপনাকে OTP বলেছেন: {#}।", "You marked {#} hours available on your calendar this cycle. You need at least {#} hours to be eligible for the earning guarantee.": "এই সাইকেলে আপনি ক্যালেন্ডারে {#} ঘণ্টা অ্যাভেলেবল মার্ক করেছেন। আয়ের গ্যারান্টি পেতে অন্তত {#} ঘণ্টা লাগবে।", "You need to change your registered phone number. Call support from the app and get the request raised.": "আপনার রেজিস্টার্ড ফোন নম্বর বদলাতে হবে। অ্যাপ থেকে সাপোর্টে কল করে রিকোয়েস্ট করিয়ে নিন।", "You reached the customer's home at booking time. The house is locked and the customer is not answering. Cancel the job the right way so it is not counted.": "বুকিং সময়ে আপনি কাস্টমারের বাড়িতে পৌঁছেছেন। বাড়ি তালাবন্ধ আর কাস্টমার ফোন ধরছেন না। জবটা ঠিকভাবে ক্যানসেল করুন, যাতে গোনা না হয়।", "Your last job subscription has expired. You got {#} of the {#} jobs in that subscription. Contact the Help Center to know about renewing.": "আপনার শেষ জব সাবস্ক্রিপশনের মেয়াদ শেষ হয়ে গেছে। ওই সাবস্ক্রিপশনে {#}টার মধ্যে {#}টা জব পেয়েছেন। রিনিউ করার ব্যাপারে জানতে হেল্প সেন্টারে যোগাযোগ করুন।", "Your rank will be downgraded on the next review date. Your jobs will be paused, and you will have a performance review with the trainer to help you understand how you can improve.": "পরের রিভিউয়ের দিন আপনার র‍্যাঙ্ক কমে যাবে। আপনার জব বন্ধ থাকবে, আর ট্রেনারের সাথে একটা পারফরম্যান্স রিভিউ হবে, যাতে আপনি বুঝতে পারেন কীভাবে উন্নতি করবেন।", "Your upcoming payout of ₹{#} will be deposited by {#} Sep. You can \"Confirm and update calendar\" or the change is not saved": "সদায় \"নিশ্চিত কৰি কেলেণ্ডাৰ আপডেট কৰক\" টেপ কৰক, নহ'লে সলনিখিনি ছেভ নহয়", "Always wear UC uniform while delivering a job.<br>Arrive at the customer's location on time.<br>Use genuine and good quality products.<br>Follow all training SOPs during the job.": "জব কৰোঁতে সদায় UC ইউনিফৰ্ম পিন্ধক।<br>কাষ্টমাৰৰ ঠিকনাত সময়মতে উপস্থিত হওক।<br>আচল আৰু ভাল মানৰ প্ৰডাক্ট ব্যৱহাৰ কৰক।<br>জবৰ সময়ত প্ৰশিক্ষণৰ সকলো SOP মানি চলক।", "Ask the customer to reschedule from their UC app. If needed, take Help.": "কাষ্টমাৰক তেওঁলোকৰ UC এপৰ পৰা সময় সলনি কৰিবলৈ কওক। প্ৰয়োজন হ'লে Help লওক।", "At booking time the customer is not answering and the house is locked. What do you do?": "বুকিঙৰ সময়ত কাষ্টমাৰে উত্তৰ দিয়া নাই আৰু ঘৰত তলা লগোৱা আছে। আপুনি কি কৰিব?", "Before and after photos of every area you worked on. These are your proof if the customer complains.": "আপুনি কাম কৰা প্ৰতিটো ঠাইৰ আগৰ আৰু পিছৰ ফটো। কাষ্টমাৰে অভিযোগ কৰিলে এইবোৰেই আপোনাৰ প্ৰমাণ।", "Before leaving, ask the customer to rate you in the app. Keep rating {#}+ for Gold.": "ওলাই যোৱাৰ আগতে কাষ্টমাৰক এপত আপোনাক ৰেটিং দিবলৈ কওক। গ'ল্ডৰ বাবে ৰেটিং {#}+ ৰাখক।", "Break days can't be used between {#}-{#}-{#} and {#}-{#}-{#} due to high demand during Diwali; these days will be marked as leave": "দীপাৱলীৰ সময়ত বেছি চাহিদাৰ বাবে {#}-{#}-{#} আৰু {#}-{#}-{#}ৰ মাজত ব্ৰেকৰ দিন ব্যৱহাৰ কৰিব নোৱাৰি; এই দিনবোৰ ছুটী হিচাপে মাৰ্ক কৰা হ'ব", "Breaks are blocked during Diwali ({#} Oct–{#} Nov); those days become leave": "দীপাৱলীৰ সময়ত ({#} অক্টো–{#} নৱে) ব্ৰেক বন্ধ থাকে; সেই দিনবোৰ ছুটী হয়", "By continuing, you consent to UC receiving your Aadhaar details (name, date of birth, address, photo) through UIDAI, only to verify your identity. You can withdraw consent by writing to privacy@urbancompany.com.": "আগবাঢ়ি গ'লে আপুনি সন্মতি দিছে যে কেৱল আপোনাৰ পৰিচয় ভেৰিফাই কৰিবলৈ UC-এ UIDAI-ৰ জৰিয়তে আপোনাৰ আধাৰৰ তথ্য (নাম, জন্মৰ তাৰিখ, ঠিকনা, ফটো) ল'ব। privacy@urbancompany.com লৈ লিখি আপুনি সন্মতি ঘূৰাই ল'ব পাৰে।", "Cancelled: customer not reachable. ₹{#} compensation will be credited to your bank. Not counted as a cancellation.": "কেন্সেল হ'ল: কাষ্টমাৰক পোৱা নগ'ল। ₹{#} ক্ষতিপূৰণ আপোনাৰ বেংকত জমা হ'ব। কেন্সেলেচন হিচাপে গণনা নহয়।", "Cancelling yourself counts as a cancellation. Take Help first.": "নিজে কেন্সেল কৰিলে কেন্সেলেচন হিচাপে গণনা হয়। প্ৰথমে Help লওক।", "Challenge accepted. This cancellation is removed from your Target metrics.": "চেলেঞ্জ গ্ৰহণ কৰা হ'ল। এই কেন্সেলেচন আপোনাৰ টাৰ্গেট মেট্ৰিক্সৰ পৰা আঁতৰোৱা হ'ল।", "Changing the phone number needs identity verification, which a support agent does. Shall I connect you to an agent?": "ফোন নম্বৰ সলনি কৰিবলৈ পৰিচয় ভেৰিফিকেচন লাগে, যিটো চাপ'ৰ্ট এজেণ্টে কৰে। মই আপোনাক এজেণ্টৰ সৈতে সংযোগ কৰি দিওঁনে?", "Check the metric criteria for the rank by clicking on view details on the target screen. At your next review date, if all your metrics satisfy the criteria for this rank, your rank will be increased.": "টাৰ্গেট স্ক্ৰীণত view details টেপ কৰি ৰেংকৰ মেট্ৰিক্সৰ চৰ্তবোৰ চাওক। পিছৰ ৰিভিউৰ তাৰিখত যদি আপোনাৰ সকলো মেট্ৰিক্সে এই ৰেংকৰ চৰ্ত পূৰণ কৰে, তেন্তে আপোনাৰ ৰেংক বৃদ্ধি কৰা হ'ব।", "Contact us → Call Support. An AI assistant answers first. If it cannot solve your issue, it connects you to a support agent (CX-PX).": "Contact us → Call Support। প্ৰথমে এটা AI সহায়কে উত্তৰ দিয়ে। ই আপোনাৰ সমস্যা সমাধান কৰিব নোৱাৰিলে আপোনাক চাপ'ৰ্ট এজেণ্ট (CX-PX)ৰ সৈতে সংযোগ কৰে।", "Could not send (no internet?). It will retry next time you open the app. Show this screen to your trainer.": "পঠিয়াব পৰা নগ'ল (ইণ্টাৰনেট নাই নেকি?)। পিছৰবাৰ এপ খুলিলে আকৌ চেষ্টা কৰিব। এই স্ক্ৰীণখন আপোনাৰ ট্ৰেইনাৰক দেখুৱাওক।", "Credits are used to buy leads (jobs). \"Added from payout\" means UC recharged your credits from your weekly payout ({#} credit = ₹{#}).": "ক্ৰেডিটেৰে লিড (জব) কিনা হয়। \"Added from payout\"ৰ অৰ্থ হ'ল UC-এ আপোনাৰ সাপ্তাহিক পেআউটৰ পৰা আপোনাৰ ক্ৰেডিট ৰিচাৰ্জ কৰিছে ({#} ক্ৰেডিট = ₹{#})।", "Customer not reachable after {#} calls at the booking location. ₹{#} will be credited to your bank account as compensation and this cancellation will not be counted.": "বুকিঙৰ ঠিকনাত {#} বাৰ কল কৰাৰ পিছতো কাষ্টমাৰক পোৱা নগ'ল। ক্ষতিপূৰণ হিচাপে ₹{#} আপোনাৰ বেংক একাউণ্টত জমা হ'ব আৰু এই কেন্সেলেচন গণনা কৰা নহ'ব।", "Do not cancel the job yourself. After the report, the team talks to the customer and decides.": "নিজে জবটো কেন্সেল নকৰিব। ৰিপ'ৰ্টৰ পিছত টীমে কাষ্টমাৰৰ সৈতে কথা পাতি সিদ্ধান্ত লয়।", "Easy-order lets you order products now. The amount is recovered from your job payouts (shown as \"Pending for products\" in your weekly settlement).": "ইজি-অৰ্ডাৰেৰে আপুনি এতিয়াই প্ৰডাক্ট অৰ্ডাৰ কৰিব পাৰে। টকাখিনি আপোনাৰ জবৰ পেআউটৰ পৰা কাটি লোৱা হয় (সাপ্তাহিক ছেটলমেণ্টত \"Pending for products\" হিচাপে দেখুৱায়)।", "Emergency break is only for today or tomorrow, twice per cycle": "জৰুৰীকালীন ব্ৰেক কেৱল আজি বা কালিৰ বাবে, প্ৰতি চাইকেলত দুবাৰ", "Emergency break taken for {#} September. Remaining jobs cancelled with no penalty.": "{#} ছেপ্টেম্বৰৰ বাবে জৰুৰীকালীন ব্ৰেক লোৱা হ'ল। বাকী জববোৰ জৰিমনা নোহোৱাকৈ কেন্সেল হ'ল।", "Guarantee depends on rank: Gold/Diamond ₹{#}, Silver ₹{#}, Bronze ₹{#}": "গেৰাণ্টী ৰেংকৰ ওপৰত নিৰ্ভৰ কৰে: গ'ল্ড/ডায়মণ্ড ₹{#}, ছিলভাৰ ₹{#}, ব্ৰঞ্জ ₹{#}", "Higher rank = bigger guarantee, loans, insurance, longer pause cover": "উচ্চ ৰেংক = বেছি গেৰাণ্টী, লোন, বীমা, দীঘলীয়া পজ কভাৰ", "I can see the Esha Saini job on {#} Sep was counted as a cancellation because it was cancelled from your side. If you think this is wrong, I can connect you to an agent to check.": "মই দেখিছোঁ, {#} ছেপ্টৰ ঈশা ছাইনীৰ জবটো কেন্সেলেচন হিচাপে গণনা কৰা হৈছে, কিয়নো ই আপোনাৰ ফালৰ পৰা কেন্সেল কৰা হৈছিল। যদি আপুনি ভাবে এইটো ভুল, মই আপোনাক চেক কৰিবলৈ এজেণ্টৰ সৈতে সংযোগ কৰি দিব পাৰোঁ।", "I checked the call records. The customer did not answer your calls, so this is not your fault. I have raised a Cancellation Penalty Challenge. You will get the result within {#} hours.": "মই কল ৰেকৰ্ড চালোঁ। কাষ্টমাৰে আপোনাৰ কলৰ উত্তৰ দিয়া নাছিল, গতিকে এইটো আপোনাৰ দোষ নহয়। মই Cancellation Penalty Challenge দাখিল কৰিছোঁ। আপুনি {#} ঘণ্টাৰ ভিতৰত ফলাফল পাব।", "I have noted it. A team member will call the customer and help you with material.": "মই লিখি ৰাখিলোঁ। টীমৰ এজন সদস্যই কাষ্টমাৰক কল কৰিব আৰু সামগ্ৰীৰ বাবে আপোনাক সহায় কৰিব।", "I have verified your Aadhaar and old number. I have raised the number change request. Your new number will work for login within {#} hours, and you will get an SMS.": "মই আপোনাৰ আধাৰ আৰু পুৰণি নম্বৰ ভেৰিফাই কৰিলোঁ। মই নম্বৰ সলনিৰ অনুৰোধ দাখিল কৰিছোঁ। আপোনাৰ নতুন নম্বৰ {#} ঘণ্টাৰ ভিতৰত লগইনৰ বাবে চলিব, আৰু আপুনি এটা SMS পাব।", "If a deduction (loan EMI, product or penalty) cannot be recovered from a payout, it shows here and is recovered from your next payout.": "যদি কোনো কৰ্তন (লোন EMI, প্ৰডাক্ট বা জৰিমনা) পেআউটৰ পৰা কাটিব পৰা নাযায়, সেয়া ইয়াত দেখুৱায় আৰু আপোনাৰ পিছৰ পেআউটৰ পৰা কাটি লোৱা হয়।", "If the customer wants to reschedule, they do it from their app": "কাষ্টমাৰে সময় সলনি কৰিব বিচাৰিলে তেওঁলোকে নিজৰ এপৰ পৰা কৰে", "If you are in bronze or silver rank, this rank will be applicable to you for {#} days until your next review cycle. If you are a gold partner, this rank will be applicable to you for {#} days, until your next review cycle. If you are a Diamond partner, this rank will be applicable to you for {#} days.": "যদি আপুনি ব্ৰঞ্জ বা ছিলভাৰ ৰেংকত আছে, পিছৰ ৰিভিউ চাইকেললৈকে {#} দিনৰ বাবে এই ৰেংক আপোনাৰ বাবে লাগু হ'ব। যদি আপুনি গ'ল্ড পাৰ্টনাৰ, পিছৰ ৰিভিউ চাইকেললৈকে {#} দিনৰ বাবে এই ৰেংক লাগু হ'ব। যদি আপুনি ডায়মণ্ড পাৰ্টনাৰ, এই ৰেংক {#} দিনৰ বাবে লাগু হ'ব।", "If you earn less, you get {#}% of the gap; a paused profile gets rejected": "আপুনি কম উপাৰ্জন কৰিলে পাৰ্থক্যৰ {#}% পাব; পজ হোৱা প্ৰফাইল নাকচ হয়", "If you ever collect cash from a customer, it is adjusted here from your payout.": "আপুনি কেতিয়াবা কাষ্টমাৰৰ পৰা নগদ টকা ল'লে, সেয়া ইয়াত আপোনাৰ পেআউটৰ পৰা মিলাই লোৱা হয়।", "In the real app, GPS checks you are at the customer location at booking time.": "আচল এপত, বুকিঙৰ সময়ত আপুনি কাষ্টমাৰৰ ঠিকনাত আছে নে নাই GPS-এ চেক কৰে।", "It is raining heavily here. Sharing a video so you can decide.": "ইয়াত প্ৰবল বৰষুণ দি আছে। আপুনি সিদ্ধান্ত ল'ব পৰাকৈ এটা ভিডিঅ' শ্বেয়াৰ কৰিছোঁ।", "It is raining very heavily and UC has sent an alert. Cancel today's job without penalty.": "বৰ প্ৰবল বৰষুণ দি আছে আৰু UC-এ সতৰ্কবাণী পঠিয়াইছে। আজিৰ জবটো জৰিমনা নোহোৱাকৈ কেন্সেল কৰক।", "Know what happens when your targets are below minimum rank requirements": "আপোনাৰ টাৰ্গেট ৰেংকৰ নিম্নতম চৰ্ততকৈ কম হ'লে কি হয় জানক", "Leave the place right now. Do not argue. The safety team has your location and will call you in {#} minutes. You will not be penalised for leaving.": "এতিয়াই ঠাইখন এৰি ওলাই আহক। তৰ্ক নকৰিব। সুৰক্ষা টীমৰ ওচৰত আপোনাৰ লোকেচন আছে আৰু {#} মিনিটত আপোনাক কল কৰিব। ওলাই অহাৰ বাবে আপোনাৰ কোনো জৰিমনা নহ'ব।", "Missing even Bronze gives a profile strike; {#} in {#} months = removal": "ব্ৰঞ্জো নাপালে প্ৰফাইল ষ্ট্ৰাইক হয়; {#}টা ষ্ট্ৰাইক {#} মাহৰ ভিতৰত = আঁতৰোৱা হয়", "Move to a safe place and sit down. I have alerted the UC safety team and shared your location. They will call you within {#} minutes. Your job is on hold and there is no penalty. Your insurance covers minor accident treatment.": "সুৰক্ষিত ঠাইলৈ গৈ বহি লওক। মই UC সুৰক্ষা টীমক জনাইছোঁ আৰু আপোনাৰ লোকেচন শ্বেয়াৰ কৰিছোঁ। তেওঁলোকে {#} মিনিটৰ ভিতৰত আপোনাক কল কৰিব। আপোনাৰ জব ৰখোৱা হৈছে আৰু কোনো জৰিমনা নাই। আপোনাৰ বীমাই সৰু দুৰ্ঘটনাৰ চিকিৎসা কভাৰ কৰে।", "Namaste {name}! I am UC's AI assistant. Please tell me your issue.": "নমস্কাৰ {name}! মই UC-ৰ AI সহায়ক। অনুগ্ৰহ কৰি আপোনাৰ সমস্যা কওক।", "Need to change your phone number? It cannot be edited here. Go to Help → Contact us → Call Support and ask for a number change.": "ফোন নম্বৰ সলনি কৰিব লাগে নেকি? ইয়াত সলনি কৰিব নোৱাৰি। Help → Contact us → Call Support-লৈ গৈ নম্বৰ সলনি কৰিবলৈ কওক।", "Net Earnings = Total Earnings − Total Deductions. Deductions are what you pay to UC (commission, service charge, material) and to the government (GST, TDS).": "নিট উপাৰ্জন = মুঠ উপাৰ্জন − মুঠ কৰ্তন। কৰ্তন হ'ল আপুনি UC-ক (কমিচন, চাৰ্ভিচ চাৰ্জ, সামগ্ৰী) আৰু চৰকাৰক (GST, TDS) দিয়া টকা।", "No hints in the test. Do it the way you will do it on a real job.": "টেষ্টত কোনো ইংগিত নাথাকে। আচল জবত যেনেকৈ কৰিব, তেনেকৈয়ে কৰক।", "On weekdays, {#} AM–{#} PM and {#} PM–{#} PM are peak slots ({#} hours a day). Every peak hour you do not mark available is added here. Break days are not counted.": "সপ্তাহৰ দিনবোৰত {#} AM–{#} PM আৰু {#} PM–{#} PM পিক স্লট (দিনে {#} ঘণ্টা)। যিবোৰ পিক ঘণ্টা আপুনি উপলব্ধ বুলি মাৰ্ক নকৰে, সেইবোৰ ইয়াত যোগ হয়। ব্ৰেকৰ দিন গণনা নহয়।", "On {#} October you are not free from {#} to {#} AM. Turn off only that slot and save the calendar.": "{#} অক্টোবৰত আপুনি {#}ৰ পৰা {#} AM লৈকে খালী নাই। কেৱল সেই স্লটটো বন্ধ কৰক আৰু কেলেণ্ডাৰ ছেভ কৰক।", "One or more metrics were outside your rank limit in this cycle, so the guarantee did not apply.": "এই চাইকেলত এটা বা তাতকৈ বেছি মেট্ৰিক্স আপোনাৰ ৰেংকৰ সীমাৰ বাহিৰত আছিল, গতিকে গেৰাণ্টী লাগু নহ'ল।", "Only cancel jobs in emergency situations. If an incorrect cancellation is marked against you, please visit the help center to resolve it.": "কেৱল জৰুৰী অৱস্থাতহে জব কেন্সেল কৰক। যদি আপোনাৰ নামত ভুলকৈ কেন্সেলেচন মাৰ্ক হয়, সমাধানৰ বাবে সহায় কেন্দ্ৰলৈ যাওক।", "Only {#} hours were marked available. Minimum {#} hours are required, so you were not eligible.": "কেৱল {#} ঘণ্টা উপলব্ধ বুলি মাৰ্ক কৰা হৈছিল। নিম্নতম {#} ঘণ্টা লাগে, গতিকে আপুনি যোগ্য নাছিল।", "Open the job from Target → Cancellations and tap \"Need help?\"": "টাৰ্গেট → Cancellations-ৰ পৰা জবটো খুলি \"Need help?\" টেপ কৰক", "Opens Cleartax \"Tax Wapsi\" WhatsApp ITR filing in the browser": "ব্ৰাউজাৰত Cleartax \"Tax Wapsi\" WhatsApp ITR ফাইলিং খোলে", "Paid to UC = commission + service charge + material auto-replenishment": "Paid to UC = কমিচন + চাৰ্ভিচ চাৰ্জ + সামগ্ৰীৰ অটো-ৰিফিল", "Pari Sharma sees: \"Your professional added work worth ₹{#}. Approve?\"": "পৰী শৰ্মাই দেখে: \"Your professional added work worth ₹{#}. Approve?\"", "Part of the payout recharges credits (wallet); the rest goes to bank": "পেআউটৰ এটা অংশৰে ক্ৰেডিট (ৱালেট) ৰিচাৰ্জ হয়; বাকীখিনি বেংকলৈ যায়", "Payment history shows each recovery attempt. \"Payment failed\" means there was not enough payout that week; the amount moves to your next payout.": "পেমেণ্ট হিষ্ট্ৰিত প্ৰতিবাৰ কাটিবলৈ কৰা চেষ্টা দেখুৱায়। \"Payment failed\"ৰ অৰ্থ হ'ল সেই সপ্তাহত যথেষ্ট পেআউট নাছিল; টকাখিনি আপোনাৰ পিছৰ পেআউটলৈ যায়।", "Peak hour slot: {#} AM–{#} PM and {#}–{#} PM on weekdays, all slots on weekends": "পিক ঘণ্টাৰ স্লট: সপ্তাহৰ দিনত {#} AM–{#} PM আৰু {#}–{#} PM, উইকেণ্ডত সকলো স্লট", "Pending deductions show amounts not yet recovered from payouts": "বাকী থকা কৰ্তনত পেআউটৰ পৰা এতিয়াও কাটি লোৱা নোহোৱা টকা দেখুৱায়", "Practice only. No real job, payment, ticket, calendar change or call is created. Names, amounts and some rules are sample data.": "কেৱল অনুশীলন। কোনো আচল জব, পেমেণ্ট, টিকট, কেলেণ্ডাৰৰ সলনি বা কল নহয়। নাম, টকাৰ পৰিমাণ আৰু কিছুমান নিয়ম নমুনা তথ্য।", "Practice the UC partner app before your first real job. Mistakes here cost nothing.": "আপোনাৰ প্ৰথম আচল জবৰ আগতে UC পাৰ্টনাৰ এপ অনুশীলন কৰক। ইয়াত ভুল হ'লে একো ক্ষতি নহয়।", "Pressing Emergency on Home, Help or the job page triggers an instant call from UC's AI bot.": "হোম, Help বা জবৰ পেজত জৰুৰীকালীন টিপিলে UC-ৰ AI বটৰ পৰা লগে লগে কল আহে।", "Profile shows your details; the phone number is changed via Help → Call Support": "প্ৰফাইলত আপোনাৰ তথ্য দেখুৱায়; ফোন নম্বৰ Help → Call Support-ৰ জৰিয়তে সলনি কৰা হয়", "Record a video of the rain and send it in the job's customer chat": "বৰষুণৰ ভিডিঅ' ৰেকৰ্ড কৰি জবৰ কাষ্টমাৰ চেটত পঠিয়াওক", "Saturday and Sunday each have {#} working hours ({#} AM to {#} PM). Every weekend hour you do not mark available on your calendar is added here. Break days are not counted.": "শনিবাৰ আৰু দেওবাৰে প্ৰতিদিনে {#} ঘণ্টা কামৰ সময় ({#} AM ৰ পৰা {#} PM)। যিবোৰ উইকেণ্ড ঘণ্টা আপুনি কেলেণ্ডাৰত উপলব্ধ বুলি মাৰ্ক নকৰে, সেইবোৰ ইয়াত যোগ হয়। ব্ৰেকৰ দিন গণনা নহয়।", "Say: \"Namaste, I am your UC professional. I am stuck in traffic and will reach by {#} PM. Sorry for the delay.\"": "কওক: \"নমস্কাৰ, মই আপোনাৰ UC প্ৰফেচনেল। মই ট্ৰেফিকত আবদ্ধ হৈ আছোঁ আৰু {#} PM-ৰ ভিতৰত পাম। পলমৰ বাবে দুঃখিত।\"", "So if your job value is less than promised, UC pays {#}% of the difference, which is what you would have earned.": "গতিকে যদি আপোনাৰ জব মূল্য প্ৰতিশ্ৰুতিতকৈ কম হয়, UC-এ পাৰ্থক্যৰ {#}% দিয়ে, যিটো আপুনি উপাৰ্জন কৰিব পাৰিলেহেঁতেন।", "Sorry, I am running {#} minutes late due to traffic. I will reach by {#} PM.": "দুঃখিত, ট্ৰেফিকৰ বাবে মোৰ {#} মিনিট পলম হৈছে। মই {#} PM-ৰ ভিতৰত পাম।", "Start only after the customer approves in their app; never take cash": "কাষ্টমাৰে নিজৰ এপত অনুমোদন দিয়াৰ পিছতহে আৰম্ভ কৰক; কেতিয়াও নগদ টকা নল'ব", "Start the extra work only after approval. Never take cash for extra work.": "অনুমোদনৰ পিছতহে অতিৰিক্ত কাম আৰম্ভ কৰক। অতিৰিক্ত কামৰ বাবে কেতিয়াও নগদ টকা নল'ব।", "Stay at the location, call twice, then Cancel Job → Customer is unreachable": "ঠিকনাতে থাকক, দুবাৰ কল কৰক, তাৰ পিছত Cancel Job → Customer is unreachable", "Study the tables, then open \"For how long am I in a given rank?\".": "টেবুলবোৰ ভালদৰে চাওক, তাৰ পিছত \"মই এটা ৰেংকত কিমান দিন থাকিম?\" খোলক।", "Support raised it on your call. You will get the result within {#} hours.": "আপোনাৰ কলত চাপ'ৰ্টে ইয়াক দাখিল কৰিলে। আপুনি {#} ঘণ্টাৰ ভিতৰত ফলাফল পাব।", "Take a clear photo of the existing damage with the proofs, so it is not blamed on you later.": "প্ৰমাণৰ সৈতে আগৰে পৰা থকা ক্ষতিৰ স্পষ্ট ফটো তোলক, যাতে পিছত আপোনাক দোষ দিয়া নহয়।", "Take the OTP only from the customer, never share it with anyone else.": "OTP কেৱল কাষ্টমাৰৰ পৰাহে লওক, কেতিয়াও আন কাকো শ্বেয়াৰ নকৰিব।", "Tap the glowing button each time. Read the hint above the phone.": "প্ৰতিবাৰ জিলিকি থকা বুটামটো টেপ কৰক। ফোনৰ ওপৰৰ ইংগিতটো পঢ়ক।", "Tell the customer it is raining heavily, ask if they still want the job today or want to reschedule. Then send a rain video in chat.": "কাষ্টমাৰক কওক যে প্ৰবল বৰষুণ দি আছে, তেওঁলোকে আজিয়েই জবটো বিচাৰে নে সময় সলনি কৰিব বিচাৰে সোধক। তাৰ পিছত চেটত বৰষুণৰ ভিডিঅ' পঠিয়াওক।", "Thanks for the video. It is really heavy. Let us reschedule to tomorrow.": "ভিডিঅ'টোৰ বাবে ধন্যবাদ। সঁচাকৈয়ে বৰ বেছি বৰষুণ। কালিলৈ সময় সলনি কৰোঁ আহক।", "The agent raises a \"Cancellation Penalty Challenge\"; if accepted, the count is removed": "এজেণ্টে \"Cancellation Penalty Challenge\" দাখিল কৰে; গ্ৰহণ হ'লে গণনাটো আঁতৰোৱা হয়", "The booked package cannot be changed here. Add extra work with ADD.": "বুক কৰা পেকেজ ইয়াত সলনি কৰিব নোৱাৰি। ADD-ৰে অতিৰিক্ত কাম যোগ কৰক।", "The booked work can't be done (e.g. no water). Tap \"Booked work can't be done?\".": "বুক কৰা কাম কৰিব নোৱাৰি (যেনে: পানী নাই)। \"বুক কৰা কাম কৰিব নোৱাৰিনে?\" টেপ কৰক।", "The customer pays for the approved extra work in the UC app. Do not take cash.": "অনুমোদিত অতিৰিক্ত কামৰ পেমেণ্ট কাষ্টমাৰে UC এপত কৰে। নগদ টকা নল'ব।", "The customer wants more work than booked. What is the right way?": "কাষ্টমাৰে বুক কৰাতকৈ বেছি কাম বিচাৰিছে। শুদ্ধ উপায় কি?", "The customer will be told you have arrived. Do not tap this on the way.": "কাষ্টমাৰক জনোৱা হ'ব যে আপুনি আহি পাইছে। বাটত থাকোঁতে ইয়াত টেপ নকৰিব।", "The customer's number is hidden. Calls and chats go through UC, so always contact the customer from the app.": "কাষ্টমাৰৰ নম্বৰ লুকুৱাই ৰখা হয়। কল আৰু চেট UC-ৰ জৰিয়তে যায়, গতিকে সদায় এপৰ পৰাহে কাষ্টমাৰৰ সৈতে যোগাযোগ কৰক।", "The job has started, but there is no water in the building, so the booked work cannot be done. Report it correctly in the app.": "জব আৰম্ভ হৈছে, কিন্তু বিল্ডিঙত পানী নাই, গতিকে বুক কৰা কাম কৰিব নোৱাৰি। এপত শুদ্ধকৈ ৰিপ'ৰ্ট কৰক।", "The job is in progress. The customer also wants {#} bathroom exhaust fan cleaned. Add this work in the app and get it approved by the customer.": "জব চলি আছে। কাষ্টমাৰে {#}টা বাথৰুমৰ এগজষ্ট ফেনো চাফা কৰাব বিচাৰে। এই কামটো এপত যোগ কৰক আৰু কাষ্টমাৰৰ পৰা অনুমোদন লওক।", "The team will review and talk to the customer. You will get a call or app notification.": "টীমে পৰীক্ষা কৰিব আৰু কাষ্টমাৰৰ সৈতে কথা পাতিব। আপুনি কল বা এপ নটিফিকেচন পাব।", "The {#}-digit OTP is shown inside the booking in the customer's UC app.": "{#}-অংকৰ OTP কাষ্টমাৰৰ UC এপত বুকিঙৰ ভিতৰত দেখুৱায়।", "The ☰ menu has profile, calendar, credits, loans, insurance and training": "☰ মেনুত প্ৰফাইল, কেলেণ্ডাৰ, ক্ৰেডিট, লোন, বীমা আৰু প্ৰশিক্ষণ আছে", "Then the \"Cancel\" button shows: you get ₹{#} and it is not counted. Helpline cannot cancel for you": "তাৰ পিছত \"Cancel\" বুটাম ওলায়: আপুনি ₹{#} পাব আৰু ইয়াক গণনা কৰা নহ'ব। হেল্পলাইনে আপোনাৰ হৈ কেন্সেল কৰিব নোৱাৰে", "There is a sudden emergency at home and you cannot work today. Take an emergency break for today.": "ঘৰত হঠাৎ জৰুৰী অৱস্থা হৈছে আৰু আপুনি আজি কাম কৰিব নোৱাৰে। আজিৰ বাবে জৰুৰীকালীন ব্ৰেক লওক।", "Think this is wrong? Tap \"Need help?\" below and talk to support. They raise a cancellation challenge for you.": "এইটো ভুল বুলি ভাবিছে? তলত \"Need help?\" টেপ কৰি চাপ'ৰ্টৰ সৈতে কথা পাতক। তেওঁলোকে আপোনাৰ হৈ কেন্সেলেচন চেলেঞ্জ দাখিল কৰিব।", "This call is recorded in the app as a call attempt. Wait a few minutes before calling again.": "এই কলটো এপত কল কৰাৰ চেষ্টা হিচাপে ৰেকৰ্ড হয়। আকৌ কল কৰাৰ আগতে কেইমিনিটমান অপেক্ষা কৰক।", "This is the amount that goes to your bank after deductions and after recharging your wallet (credits).": "কৰ্তনৰ পিছত আৰু আপোনাৰ ৱালেট (ক্ৰেডিট) ৰিচাৰ্জৰ পিছত এই টকাখিনি আপোনাৰ বেংকলৈ যায়।", "This is UC emergency support. Are you safe? Tell me what happened.": "এইটো UC জৰুৰীকালীন চাপ'ৰ্ট। আপুনি সুৰক্ষিত নে? কি হ'ল মোক কওক।", "To install: open the browser menu (⋮) and tap \"Install app\" or \"Add to Home screen\".": "ইনষ্টল কৰিবলৈ: ব্ৰাউজাৰ মেনু (⋮) খুলি \"Install app\" বা \"Add to Home screen\" টেপ কৰক।", "Today's job was cancelled automatically, no penalty. Tap to see.": "আজিৰ জবটো নিজে নিজে কেন্সেল হ'ল, জৰিমনা নাই। চাবলৈ টেপ কৰক।", "Total earnings = job value + cancellation incentive + incentive + tip": "মুঠ উপাৰ্জন = জব মূল্য + কেন্সেলেচন ইনচেণ্টিভ + ইনচেণ্টিভ + টিপ", "Try anything. Nothing here affects a real job, payout or calendar.": "যিকোনো কিবা চেষ্টা কৰক। ইয়াৰ একোৱেই আচল জব, পেআউট বা কেলেণ্ডাৰত প্ৰভাৱ নেপেলায়।", "Turning off a peak slot ({#}–{#}, {#}–{#}) adds peak unavailable hours": "পিক স্লট ({#}–{#}, {#}–{#}) বন্ধ কৰিলে পিক অনুপলব্ধ ঘণ্টা যোগ হয়", "UAN is the {#}-digit number on your eShram card, a government ID for workers. It helps you get government welfare schemes.": "UAN হৈছে আপোনাৰ eShram কাৰ্ডৰ {#}-অংকৰ নম্বৰ, যিটো শ্ৰমিকৰ বাবে চৰকাৰী ID। ই আপোনাক চৰকাৰী কল্যাণমূলক আঁচনি পোৱাত সহায় কৰে।", "UC commission/service charge, GST/TDS, loan and products (easy-order)": "UC কমিচন/চাৰ্ভিচ চাৰ্জ, GST/TDS, লোন আৰু প্ৰডাক্ট (ইজি-অৰ্ডাৰ)", "UC has allowed this job to be cancelled without penalty. Use Cancel Job → Heavy rain.": "UC-এ এই জবটো জৰিমনা নোহোৱাকৈ কেন্সেল কৰাৰ অনুমতি দিছে। Cancel Job → Heavy rain ব্যৱহাৰ কৰক।", "UC matches your selfie with your profile photo. Do not use a photo of a photo.": "UC-এ আপোনাৰ চেল্ফি প্ৰফাইল ফটোৰ সৈতে মিলাই চায়। ফটোৰ ফটো ব্যৱহাৰ নকৰিব।", "UC sent a heavy rain alert for your area. This job will be cancelled without penalty and will not be counted. The customer will be informed.": "UC-এ আপোনাৰ এলেকাৰ বাবে প্ৰবল বৰষুণৰ সতৰ্কবাণী পঠিয়াইছে। এই জবটো জৰিমনা নোহোৱাকৈ কেন্সেল হ'ব আৰু গণনা কৰা নহ'ব। কাষ্টমাৰক জনোৱা হ'ব।", "Under \"Bank transfers\", open the {#} - {#} Sep upcoming card.": "\"Bank transfers\"-ৰ তলত {#} - {#} ছেপ্টৰ অহা কাৰ্ডখন খোলক।", "Under earning guarantee, if you earn less than promised, how much does UC pay?": "উপাৰ্জনৰ গেৰাণ্টীত, আপুনি প্ৰতিশ্ৰুতিতকৈ কম উপাৰ্জন কৰিলে UC-এ কিমান দিয়ে?", "Unmarked weekday {#}–{#} and {#}–{#} hours are peak unavailable hours": "সপ্তাহৰ দিনত মাৰ্ক নকৰা {#}–{#} আৰু {#}–{#} ঘণ্টা পিক অনুপলব্ধ ঘণ্টা", "Urban Company does not increase or decrease your rating. Only customers can give you ratings.": "Urban Company-এ আপোনাৰ ৰেটিং নবঢ়ায় বা নকমায়। কেৱল কাষ্টমাৰেহে আপোনাক ৰেটিং দিব পাৰে।", "Wear your UC uniform. Your face should be clearly visible in good light.": "আপোনাৰ UC ইউনিফৰ্ম পিন্ধক। ভাল   <button class="jc" data-act="openJob" data-tid="home_job_card"><span><span class="tag ${tg[1]}">${tg[0]}</span><b>6:00 PM</b><span class="n">Pari Sharma</span></span><span class="ics"><span>${I('arrowr',18)}</span></span></button></div>
 <div class="sec"><div style="display:flex;gap:6px;align-items:center;font-weight:600;font-size:15px">${TB('gold',16)} MASTER</div>
  <p style="margin:10px 0 12px;font-size:15px;font-weight:600;line-height:1.4">${L('Make your referrals join & earn extra ₹3500 for every person','Referral join karwaayein aur har person pe ₹3500 extra kamayein')}</p>
  <button class="lr" style="border:1px solid var(--l);border-radius:8px" data-act="menuGo" data-arg="invite"><span class="t">${L('Recharge completed','Recharge pura hua')}</span><span class="r"><span class="v">0</span>${I('chev',16)}</span></button></div>

  <button class="lr tight" style="border:0" data-act="egOpen" data-arg="cur" data-tid="home_eg"><span style="display:flex;gap:10px;align-items:center">${okc(18)}<span><span class="s" style="margin:0">21 Aug - 04 Oct</span><span class="t">${L('₹47,700 guaranteed job value','₹47,700 guaranteed job value main')}</span></span></span>${I('chev',18)}</button></div>
 <div class="sec nb"><div class="sec-h">Quick Links</div><div class="ql">
  <button data-act="menuGo" data-arg="training">Training<small>${L('0 new videos','0 naye video')}</small></button><button data-act="menuGo" data-arg="shop">UC Shop<small>${L('Buy items','Item khareedein')}</small></button>
  <button data-act="menuGo" data-arg="loans">Loans<small>${L('Loan active','Loan active')}</small></button><button data-act="menuGo" data-arg="invite">${L('Jackpot days','Jackpot ke din')}<small>Win ₹14500</small></button></div></div>`};};

SCR.jobs=()=>{const t=S.tab,j=S.job;const tabs=[['aane','Upcoming','Aane wala'],['baaki','Pending','Baaki hai'],['pura','Completed','Pura hua'],['cancelled','Cancelled','Cancelled']];
 let c='';const tg=JTAG();
 if(t==='aane'){ c=jobLive()?`<div class="dh">${L('Today','Aaj')}, 25 Sep</div><button class="jc" data-act="openJob" data-tid="job_card"><span><span class="tag ${tg[1]}">${tg[0]}</span><b>6:00 PM</b><span class="n">Pari Sharma</span></span><span class="ics"><span>${I('phone',18)}</span><span>${I('nav',18)}</span></span></button>`:'';
  c+=`<div class="dh">26 Sep</div><button class="jc" data-act="soon"><span><span class="tag">REPEAT</span><b>9:00 AM</b><span class="n">Harsh Tiwari</span></span><span class="ics"><span>${I('phone',18)}</span><span>${I('nav',18)}</span></span></button>
   <button class="jc" data-act="soon"><span><b>12:30 PM</b><span class="n">Nandini Gowda</span></span><span class="ics"><span>${I('phone',18)}</span><span>${I('nav',18)}</span></span></button>`;}
 else if(t==='baaki') c=`<div class="empty">${L('No pending jobs','Koi baaki job nahi hai')}</div>`;
 else if(t==='pura'){c=(j.status==='done'?`<div class="dh">${L('Today','Aaj')}, 25 Sep</div><button class="jc" data-act="openJob"><span><span class="tag t-green">COMPLETED</span><b>6:00 PM</b><span class="n">Pari Sharma</span></span></button>`:'')+
  `<div class="dh">22 Sep</div><button class="jc" data-act="soon"><span><span class="tag t-green">Job ended</span><b>7:00 PM</b><span class="n">Abhishek N H</span></span></button><button class="jc" data-act="soon"><span><span class="tag t-green">Job ended</span><b>11:30 AM</b><span class="n">Nandini Gowda</span></span></button>`;}

  c=(j.status==='cancelled'?`<div class="dh">${L('Today','Aaj')}, 25 Sep</div><button class="jc" data-act="openJob"><span><span class="tag nc">${L('Cancelled · not counted','Cancel · count nahi hua')}</span><b>6:00 PM</b><span class="n">Pari Sharma</span></span>${I('chev')}</button>`:'')+
  `<div class="dh">23 Sep</div><button class="jc" data-act="cxlOpen" data-tid="cxl_card"><span>${ctg}<b>1:00 PM</b><span class="n">${CXN.name}</span></span>${I('chev')}</button>
