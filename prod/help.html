const jobDetails=(sts)=>{const b=bill(sts||['ok']);const ad=S.job.ents.filter(e=>e.st!=='base'&&(sts||['ok']).includes(e.st));
 return `<div class="sec"><div class="sec-h">Job details</div>
 <div class="li"><span>${BASE.name} × ${BASE.qty}</span><span class="num"><s>${rs(BASE.mrp)}</s>${rs(BASE.price)}</span></div>
 ${ad.map(e=>Object.entries(e.items).map(([k,q])=>`<div class="li"><span>${CATI[k].n} × ${q} <span class="tag t-green nc">Add-on</span></span><span class="num">${rs(CATI[k].p*q)}</span></div>`).join('')).join('')}
 <div class="li mut"><span>Taxes and Fee</span><span class="num">${rs(b.tax)}</span></div>
 <div class="li b"><span>Total amount</span><span class="num">${rs(b.total)}</span></div>
 <div class="li mut"><span>Prepaid</span><span class="num">${rs(-b.prepaid)}</span></div>
 <div class="li b" style="margin-top:0"><span>Payment to collect</span><span class="num">${rs(b.collect)}</span></div></div>`;};

SCR.job=()=>{const j=S.job,st=j.status,tag=JTAG(),T=j.tasks;
 let banners='';
 if(S.rain&&jobLive()) banners+=`<div class="box rd">${I('alert',18)}<div><b>${L('Heavy rain alert','Tez baarish ka alert')}</b><br>${L('UC has allowed this job to be cancelled without penalty. Use Cancel Job → Heavy rain.','UC ne is job ko bina penalty cancel karne ki chhoot di hai. Cancel Job → Heavy rain chunein.')}</div></div>`;
 if(j.oos!==null) banners+=`<div class="box am">${I('alert',18)}<div><b>${L('OOS report under review','OOS report review mein hai')}</b><br>${esc(L(...OOS_R[j.oos]))}.</div></div>`;
 const ok=entAdd(['ok']); if(ok&&st==='started') banners+=`<div class="box gr">${I('check',18)}<div><b>${L('Customer approved extra work','Customer ne extra kaam approve kiya')}</b><br>${L(`${rs(ok)} added to the bill.`,`${rs(ok)} bill mein jud gaya.`)}</div></div>`;
 if(st==='cancelled'){const m={cnr:L('Cancelled: customer not reachable. ₹100 compensation will be credited to your bank. Not counted as a cancellation.','Cancel hua: customer se sampark nahi hua. ₹100 compensation bank mein aayega. Cancellation count nahi hogi.'),rain:L('Cancelled due to heavy rain alert. No penalty, not counted.','Tez baarish alert ki wajah se cancel. Koi penalty nahi, count nahi hua.'),emg:L('Cancelled due to your emergency break. No penalty.','Aapke emergency break ki wajah se cancel. Koi penalty nahi.'),oos:L('Cancelled after the UC agent\'s video review: job out of scope. No PAF.','UC agent ke video review ke baad cancel: job out of scope. Koi PAF nahi.'),oospaf:L('Cancelled by you. A cancellation penalty (PAF) applies and is not reversible.','Aapne cancel ki. Cancellation penalty (PAF) lagi, jo reverse nahi hogi.')}[j.why]||'';
  banners+=`<div class="box gy">${I('info',18)}<div>${m}</div></div>`;}
 let body=`<div class="pad"><span class="tag ${tag[1]}">${tag[0]}</span>
  <div class="h-big">${st==='started'?L('Today, 6:04 PM','Aaj, 6:04 PM'):L('Today, 6:00 PM','Aaj, 6:00 PM')}</div>
  <div class="cust">Pari Sharma <span class="tag t-green">${I('check',11,3)} Repeat customer</span></div>
  <p class="addr">${ADDR}</p>
  ${st==='started'||st==='done'?'':`<span class="tag t-green">${I('check',11,3)} ${L('UC has verified the address','UC ne address verify kiya hai')}</span>`}
  ${banners?`<div class="stack" style="margin-top:12px">${banners}</div>`:''}</div>`;
 if(st==='started'){
  const tk=(n,label,done,on,tid,btn)=>`<div class="tk ${done?'done':on?'':'off'}"><span class="n">${done?I('check',13,3):n}</span><span><b>${label}</b>${done?`<button class="ed" data-act="${tid}" data-free>${L('Edit','Badlein')}</button>`:on?`<button class="go" data-act="${tid}" data-tid="${tid}">${btn}</button>`:''}</span></div>`;
  body+=`<div style="border-top:8px solid #F4F4F6;padding-top:14px"><div class="pad" style="padding-top:0"><div class="sec-h" style="margin:0">Tasks</div></div>
  <div class="tasks">${tk(1,L('Complete work','Kaam pura karein'),T.work,1,'task_proceed','Proceed')}${tk(2,'Project checklist',T.checklist,T.work,'task_checklist','Start')}${tk(3,L('Create invoice & collect payment','Invoice banayein aur payment lein'),T.invoice,T.checklist,'task_invoice','Start')}</div></div>
  <div class="sec" style="padding-top:0"><button class="lr tight" style="border:1px solid var(--l);border-radius:8px;padding:12px" data-act="oos" data-tid="btn_oos"><span><span class="t" style="font-weight:600">${L("Booked work can't be done?",'Booked kaam nahi ho sakta?')}</span><span class="s">${L('No water/power, damage, safety risk: report OOS','Pani/bijli nahi, damage, safety risk: OOS report karein')}</span></span>${I('chev',16)}</button></div>
  <div class="acts" style="grid-template-columns:1fr 1fr"><button data-act="contact" data-tid="act_call">${I('phone',22)}Contact</button><button data-act="helpOpen" data-arg="job" data-tid="act_help">${I('help',22)}Help</button></div>`;
 } else if(jobLive()){
  body+=`<div class="pad" style="padding-top:0"><div class="sec-h" style="font-size:14px;margin:6px 0 4px">${L('Inside your hub','Aapke hub ke andar')}</div>${mapSvg()}</div>
  <div class="acts"><button data-act="contact" data-tid="act_call">${I('phone',22)}Contact</button><button data-act="nirdesh" data-tid="act_nav">${I('nav',22)}Directions</button><button data-act="jobCancel" data-tid="act_cancel">${I('xc',22)}Cancel Job</button><button data-act="helpOpen" data-arg="job" data-tid="act_help">${I('help',22)}Help</button></div>`;
 }
 body+=jobDetails();
 const allT=T.work&&T.checklist&&T.invoice;
 const foot={upcoming:`<button class="cta" data-act="arrived" data-tid="btn_arrived">Mark Arrived</button>`,
  arrived:`<button class="cta" data-act="start" data-tid="btn_start">${L('Start job','Job shuru karein')}</button>`,
  started:allT?`<button class="cta" data-act="end" data-tid="btn_end">${L('End job','Job khatam karein')}</button>`:`<button class="cta dim" data-act="endBlocked" data-free>${L('Complete all tasks to end job','Job khatam karne ke liye saare tasks poore karein')}</button>`}[st]||'';
 return{head:hdrBack(),body,foot};};

 <div class="ttl">${L('Ask the customer for the OTP','Customer se OTP maangein')}</div><p class="sub">${L('The 4-digit OTP is shown inside the booking in the customer\'s UC app.','OTP customer ke UC app mein booking ke andar dikhta hai. Ye 4 ank ka hota hai.')}</p>

/* ---- Complete work: Add work & share estimate ---- */
const allProofs=()=>S.job.ents.every(e=>(e.st==='base'||e.st==='ok')?e.p>=e.need:true);
SCR.work=()=>{const j=S.job,b=bill(['draft','sent','ok']);const draft=j.ents.some(e=>e.st==='draft'&&Object.keys(e.items).length);
 const ent=(e,i)=>{const added=e.st!=='base';const items=Object.entries(e.items);
  const stTag={draft:`<span class="tag t-amber nc">${L('Not shared yet','Abhi share nahi hua')}</span>`,sent:`<span class="tag t-blue nc">${L('Waiting for customer','Customer ka intezaar')}</span>`,ok:`<span class="tag t-green nc">${L('Approved','Approve ho gaya')}</span>`}[e.st]||'';
  return`<div class="ent"><div class="eh"><b>${e.n}</b>${added?`<button data-act="entDel" data-arg="${i}" data-tid="ent_del_${i}" aria-label="Delete">${I('xc',18)}</button>`:''}</div>
  <span class="sm">${e.dmg?L('Yes, there is damage','Haan, damage hai'):L('No, there is no damage','Nahi, koi damage nahi')}</span>${stTag}
  <button class="ul" data-act="soon">Edit details</button>
  ${items.map(([k,q])=>`<div class="li" style="padding:2px 0"><span class="sm">${CATI[k].n} × ${q}</span><span class="sm num">${rs(CATI[k].p*q)}</span></div>`).join('')}
  ${added?(items.length?`<button class="ul" data-act="entWork" data-arg="${i}" data-tid="ent_addwork_${i}">Edit work</button>`:`<button class="apb" data-act="entWork" data-arg="${i}" data-tid="ent_addwork_${i}">Add work ${I('arrowr',14)}</button>`):`<button class="ul" data-act="baseEdit">Edit work</button>`}
  ${(!added||e.st==='ok')?`<hr><span class="sm">${e.p} / ${e.need} ${L('proofs added','proofs add hue')}</span>${e.p?`<button class="ul" data-act="entProof" data-arg="${i}" data-free>Edit proofs</button>`:''}${e.p<e.need?`<button class="apb" data-act="entProof" data-arg="${i}" data-tid="ent_proof_${i}">Add proofs ${I('arrowr',14)}</button>`:`<span class="green sm" style="font-weight:600">✓ ${L('All proofs added','Saare proofs add ho gaye')}</span>`}`:''}</div>`;};
 return{head:hdrBack('Add work & share estimate',{right:''}),body:`
 <button class="addtop" data-act="addEntity" data-tid="add_top"><span><b>${L('Customer wants more work?','Customer ko aur kaam chahiye?')}</b><small>${L('Add it here and share the estimate','Yahan jodein aur estimate share karein')}</small></span><span class="addb">ADD</span></button>
 <div class="powh">${L('Work & proof of work (POW)','Kaam aur proof of work (POW)')}</div>
 ${j.ents.map(ent).join('')}
 <div style="padding:0 16px 16px"><button class="cta ghost" data-act="addEntity" data-tid="add_entity">Add entity ${I('plus',16)}</button></div>
 <div class="sec" style="border-top:8px solid #F4F4F6;border-bottom:0"><div class="sec-h">Estimate summary</div>
  <div class="li"><span>Item total</span><span class="num"><s>${rs(BASE.mrp+b.ad)}</s>${rs(BASE.price+b.ad)}</span></div>
  <div class="li b"><span>Job value</span><span class="num">${rs(b.value)}</span></div>
  <div class="li"><span>Taxes and Fee</span><span class="num">${rs(b.tax)}</span></div>
  <div class="li"><span>Prepaid</span><span class="num">${rs(-b.prepaid)}</span></div>
  <div class="li b"><span>Payment to collect</span><span class="num">${rs(b.collect)}</span></div></div>`,
 foot:draft?`<button class="cta" data-act="shareEst" data-tid="share_est">Share estimate</button>`:`<button class="cta ${allProofs()?'':'dim'}" data-act="workDone" data-tid="work_done">${L('Work complete · Continue','Kaam pura · Aage badhein')}</button>`};};

SCR.proof=()=>{const e=S.job.ents[S.ent];let g='';const cls=['','b2','b3'];const show=Math.min(e.p,5);
 for(let i=0;i<show;i++)g+=`<div class="ph ${cls[i%3]}"><span>POW ${i+1}</span></div>`;
 if(e.p>show)g+=`<div class="ph b3"><span style="font-size:14px">+${e.p-show}</span></div>`;
 if(e.p<e.need)g+=`<button class="ph add" data-act="proofAdd" data-tid="proof_add">${I('camera',22)}${L('Take photo','Photo lein')}</button>`;
 return{head:hdrBack(L('Add proofs','Proofs jodein'),{right:''}),body:`<div class="pad"><div class="ttl">${e.n}</div><p class="sub">${L('Before and after photos of every area you worked on. These are your proof if the customer complains.','Har jagah ki pehle aur baad ki photos jahan kaam kiya. Customer complaint ke waqt ye aapka saboot hain.')}</p>
 <div class="phg">${g}</div><p class="sm" style="margin-top:12px;font-weight:600">${e.p} / ${e.need} ${L('proofs added','proofs add hue')}</p></div>`,
 foot:`<button class="cta" data-act="proofSave" data-tid="proof_save">${L('Save','Save karein')}</button>`};};

SCR.dmg=()=>({head:hdrBack('',{right:''}),body:`<div class="pad"><div class="ttl">Basic information</div><p style="font-weight:600;margin:14px 0 10px">${L('Is there any existing damage?','Kya pehle se koi damage hai?')}</p>

SCR.oosvc=()=>{const v=S.vc||{phase:'ring'},ph=v.phase,oos=v.r!=null&&v.r<3;

 if(v.r!=null){tr+=me(L(...OOSVC_R[v.r]))+ag(L('Okay. Please switch on your video and point the camera at the place.','Theek hai. Apna video on kijiye aur camera us jagah ki taraf kijiye.'));}
 if(ph==='show'||ph==='done')tr+=ag(L('I can see it. Please show the whole place and the appliance together, so that I can review it properly.','Dikh raha hai. Poori jagah aur appliance saath mein dikhaiye, taaki main sahi review kar sakun.'));

  :ph==='video'?`<div class="vccam"><div class="uc">UC</div></div>`:`<div class="vccam"><div class="uc">UC</div></div>`;
 let opts='';
 if(ph==='ask')opts=`<span class="ol">${L('Tell the agent the problem (demo: tap one)','Agent ko dikkat batayein (demo: ek chunein)')}</span>${OOSVC_R.map((r,i)=>`<button data-act="oosvcReason" data-arg="${i}" data-tid="oosvc_reason_${i}">${L(...r)}</button>`).join('')}`;
 else if(ph==='video')opts=`<button class="acc" data-act="oosvcVideo" data-tid="oosvc_video">${I('camera',16)} ${L('Turn on video','Video on karein')}</button>`;
 else if(ph==='show')opts=`<button class="acc" data-act="oosvcShow" data-tid="oosvc_show">${L('Show the whole place and the appliance','Poori jagah aur appliance dikhayein')}</button>`;
 return{head:'',body:'',overlay:`<div class="vc"><style>

 .vccam .live{position:absolute;top:8px;left:10px;font-size:11px;font-weight:700;color:#fff;background:#D7261E;border-radius:6px;padding:2px 7px}

/* ======================= Screens: calendar & breaks ======================= */
const ICO={
 ok:`<span class="ci" style="color:#0E7A4E">${I('check',13,2.6)}</span>`,
 brk:`<span class="ci" style="color:#E0A000">${I('clock',13,2.2)}</span>`,
 no:`<span class="ci" style="color:#E08A00">${I('x',13,2.6)}</span>`,
 none:`<span class="ci" style="color:#9A9AA2;font-weight:600;font-size:12px;line-height:14px">—</span>`
};
function dayIcon(d){const c=S.cal[d];if(!c)return'<span class="ci"></span>';
 if(c.st==='break')return ICO.brk; if(c.st==='emg'||c.st==='leave')return ICO.no; if(c.st==='none')return ICO.none;
 return hoursOf(c.s)>0?ICO.ok:ICO.no;}
const monthTitle=m=>`${MONL[mnum(m+'-01')]} ${m.slice(0,4)}`;
const addM=(m,n)=>{const d=Dt(m+'-01');d.setUTCMonth(d.getUTCMonth()+n);return iso(d).slice(0,7);};
function monthCells(m){const first=m+'-01';const start=addD(first,-dowOf(first));const cells=[];let d=start;
 for(let i=0;i<42;i++){cells.push(d);d=addD(d,1);if(i>=34&&d.slice(0,7)!==m&&dowOf(d)===0)break;}return cells;}
const hoursTxt=h=>`<span style="color:${h>=5?'#0E7A4E':'#B26B00'}">${h} ${L('hours marked available','hours marked available')}</span>`;

SCR.cal=()=>{const m=S.calMonth,cells=monthCells(m);const minM='2026-08',maxM='2026-11';
 const grid=cells.map(d=>{const other=d.slice(0,7)!==m;const inR=!!S.cal[d];
  return `<button class="cday ${d===TODAY?'today':''} ${other?'other':''}" ${inR?`data-act="calDay" data-arg="${d}" data-tid="cal_day_${d}"`:'disabled'}>${dnum(d)}${dayIcon(d)}</button>`;}).join('');
 return{head:hdrBack('',{right:`<button class="hbtn" data-act="calToday" data-free>${L('Today','Aaj')}</button>`}),body:`
 <div class="mhead"><button class="circ ${m<=minM?'dis':''}" data-act="calMonth" data-arg="-1" data-tid="cal_prev" aria-label="Previous month">${I('chevl',18)}</button><b>${monthTitle(m)}</b><button class="circ ${m>=maxM?'dis':''}" data-act="calMonth" data-arg="1" data-tid="cal_next" aria-label="Next month">${I('chev',18)}</button></div>
 <div class="cgrid">${['S','M','T','W','T','F','S'].map(x=>`<div class="dow">${x}</div>`).join('')}${grid}</div>
 <div class="gloss" style="margin-top:8px">${acc('gloss','Glossary',`
  <div class="gl-item">${ICO.ok}<span>${L('Calendar marked (you are available)','Calendar mark hai (aap available hain)')}</span></div>
  <div class="gl-item">${ICO.brk}<span>${L('Break day (does not count in unavailable hours)','Break ka din (unavailable hours mein nahi ginta)')}</span></div>
  <div class="gl-item">${ICO.no}<span>${L('Unavailable: all slots off, leave or emergency break','Unavailable: saare slots band, leave ya emergency break')}</span></div>
  <div class="gl-item">${ICO.none}<span>${L('Calendar not marked','Calendar mark nahi kiya')}</span></div>
  <div class="gl-item"><span style="color:#0E7A4E">${I('bolt',14)}</span><span>${L('Peak hour slot: 9 AM–12 PM and 5–8 PM on weekdays, all slots on weekends','Peak hour slot: weekdays pe 9–12 aur 5–8 baje, weekend pe saare slots')}</span></div>`,'cal_gloss')}</div>
 <div class="brk"><h4>Break Days Available</h4><div class="n num">${S.breakDays}</div><div class="ns">Break days</div>
  <div class="btns"><button class="obtn" data-act="brkApply" data-tid="brk_apply">${L('Apply for break','Break ke liye apply karein')}</button><button class="obtn" data-act="brkHistory" data-tid="brk_history">View history</button></div></div>
 <button class="emgrow" data-act="emgOpen" data-tid="emg_row"><span><span style="color:#D7261E">${I('alertc',16)}</span>${L('I have an emergency','Mujhe emergency hai')}</span>${I('chev',16)}</button>`};};

const draftFor=d=>S.draft&&S.draft.d===d?S.draft.s:S.cal[d].s;
const isDirty=()=>!!S.draft&&S.draft.s.some((v,i)=>v!==S.cal[S.draft.d].s[i]);
SCR.day=()=>{const d=S.day,c=S.cal[d];const strip=[];for(let i=0;i<14;i++){const x=addD(d,i);if(!S.cal[x])break;strip.push(x);}
 const past=d<TODAY,today=d===TODAY;const s=draftFor(d);
 let slots='';
 if(c.st==='break') slots=`<div class="box am">${I('clock',18)}<div><b>${L('Break day','Break ka din')}</b><br>${L('You applied for a break on this day. It does not count in unavailable hours.','Is din aapne break liya hai. Ye unavailable hours mein nahi ginta.')}</div></div>`;
 else if(c.st==='emg') slots=`<div class="box rd">${I('alertc',18)}<div><b>${L('Emergency break taken','Emergency break liya gaya')}</b><br>${L('All slots are unavailable for this day. This cannot be undone.','Is din ke saare slots unavailable hain. Ise undo nahi kar sakte.')}</div></div>`;
 else if(c.st==='leave') slots=`<div class="box rd">${I('alertc',18)}<div><b>Leave</b><br>${L('Marked as leave (Diwali high-demand days).','Leave mark hua hai (Diwali high-demand din).')}</div></div>`;
 else if(c.st==='none'&&past) slots=`<div class="box gy">${I('info',18)}<div>${L('Calendar was not marked for this day.','Is din calendar mark nahi kiya tha.')}</div></div>`;
 else slots=SLOTS.map((sl,i)=>{const pk=isPeak(d,i);const ro=past||(today&&i<5);const job=c.jobs[i]&&!(today&&S.job.status==='cancelled');
   const on=!!s[i];

 c.innerHTML=`<div class="top"><span class="stp">${G.done?L('Done','Pura hua'):G.intro?L('Ready?','Taiyaar?'):`Step ${i+1} / ${n}`}</span><span class="mname">${T(m.t)}</span></div>
  <div class="bar"><i style="width:${(G.done?n:i)/n*100}%"></i></div><div class="hint">${hint}</div>
  <div class="btns">${mob}<button class="chip" data-c="restart">${I('refresh',14)} ${L('Restart','Shuru se')}</button><button class="chip" data-c="exit">${I('xc',14)} ${L('Exit','Band karein')}</button></div>`;}

function installHtml(){const W=window;if(W.__pwaStandalone)return'';
 if(W.__pwaPrompt)return`<button class="chip" data-install style="margin:12px 0 0 0;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:8px 14px">${I('arrowr',14)} ${L('Install app on this phone','Is phone pe app install karein')}</button>`;
 if(W.__pwaIOS)return`<p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45">${L('To install on iPhone: tap Share, then "Add to Home Screen".','iPhone pe install: Share dabayein, phir "Add to Home Screen".')}</p>`;
 return`<p style="margin:12px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45">${L('To install: open the browser menu (⋮) and tap "Install app" or "Add to Home screen".','Install karne ke liye: browser menu (⋮) kholein aur "Install app" ya "Add to Home screen" dabayein.')}</p>`;}
window.__pwaRender=()=>{try{paintPanel();}catch(e){}};
function paintPanel(){const p=document.getElementById('panel');let k=0;
 if(window.PA_MODE==='free'){p.innerHTML=`<div class="brand"><a href="index.html" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:8px">‹ Pro-Abhyas</a><h1>App <span>flow</span></h1><p>${L('The general app flow: use the whole partner app on your own, with no hints. Nothing here affects a real job, payout or calendar.','App ka general flow: poora partner app khud chalayein, bina hint ke. Yahan kisi asli job, payout ya calendar pe asar nahi hota.')}</p>
  <div class="seg" role="group" aria-label="Language">${LANGS.map(([k,n])=>`<button data-lang="${k}" aria-pressed="${LANG===k}">${n}</button>`).join('')}</div>${installHtml()}</div>${profileCard()}
  <div class="note">${L('Want step-by-step guidance? Open Practice on the Pro-Abhyas home screen.','Step-by-step seekhna hai? Pro-Abhyas home pe Practice kholein.')}</div>`;return;}
 if(E){p.innerHTML=`<div class="brand"><a href="index.html" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:8px">‹ Pro-Abhyas</a><h1>Pro-<span>Abhyas</span></h1></div>`+evalPanel();return;}
 const item=m=>{k++;const act=G.mod&&G.mod.id===m.id;const d=DONE[m.id];
  const steps=act?`<ol class="steps">${m.steps.map((st,j)=>{const cls=(G.done||j<G.i)?'d':(j===G.i&&!G.intro?'c':'');return`<li class="${cls}"><i>${cls==='d'?'✓':''}</i><span>${T(st)}</span></li>`;}).join('')}</ol>`:'';
  return`<div><button class="mod" data-m="${m.id}" aria-current="${!!act}"><span class="num ${d?'done':''}">${d?I('check',15,3):k}</span><span><b>${T(m.t)}</b><small>${T(m.d)}</small><span class="meta">${m.steps.length} steps${d?L(' · completed',' · pura kiya'):''}</span></span></button>${steps}</div>`;};
 const nd=MODULES.filter(m=>DONE[m.id]).length;
 p.innerHTML=`<div class="brand"><a href="index.html" style="display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;margin-bottom:8px">‹ Pro-Abhyas</a><h1>Pro-<span>Abhyas</span></h1><p>${L('Practice the UC partner app before your first real job. Mistakes here cost nothing.','UC partner app ki practice. Asli job se pehle yahan seekhein, galti ka koi dar nahi.')}</p>
  <div class="seg" role="group" aria-label="Language">${LANGS.map(([k,n])=>`<button data-lang="${k}" aria-pressed="${LANG===k}">${n}</button>`).join('')}</div>${installHtml()}</div>
  ${profileCard()}${evalCard()}
  <div class="grp-h"><span class="lbl">Training modules</span><span class="lbl" style="letter-spacing:.04em">${nd}/${MODULES.length} ${L('done','pure')}</span></div>
  ${GROUPS.map(g=>`<div class="grp"><span class="lbl" style="color:var(--accent)">${T(g.t)}</span>${MODULES.filter(m=>m.g===g.id).map(item).join('')}</div>`).join('')}
  
  <div class="note">${L('Practice only. No real job, payment, ticket, calendar change or call is created. Names, amounts and some rules are sample data.','Ye sirf practice ke liye hai. Koi asli job, payment, ticket, calendar badlaav ya call nahi banta. Naam, amount aur kuch rules sample hain.')}
   ${nd?`<div style="margin-top:8px"><button class="linkbtn" data-clear>${L('Clear progress','Progress mitayein')}</button></div>`:''}</div>`;}

/* ======================= Events ======================= */
function runAct(el,target){
 const tid=el.dataset.tid||'';const st=curStep();
 const ovOpen=(G.mod&&(G.intro||G.done))||(E&&E.phase!=='task');
 if(ovOpen&&!(target&&target.closest&&target.closest('.ov')))return;
 if(st&&!el.hasAttribute('data-free')&&!match(tid,st.hl)){
  if(G.eval){const x=E.tasks[E.ti];if(!evalAltPath(x,tid)&&!(tid&&(tid==='back'||x.t.ok.some(q=>match(tid,q))))){x.mist++;toast(L('That is not the right step. Think again.','Ye sahi kadam nahi hai. Dobara sochein.'));paintCoach();return;}}
  else{nudge(st);return;}}
 pending=[];
 const f=A[el.dataset.act];const r=f?f(el.dataset.arg):undefined;
 if(r!==false&&tid)fire(tid);
 pending.forEach(ev=>fire(ev));pending=[];
 if(G.eval&&G.done){evalFinishTask(false);return;}
 render();
}
appEl.addEventListener('click',e=>{const eb=e.target.closest('[data-e]');if(eb&&E){const a=eb.dataset.e;if(a==='begin'){if(E.phase==='intro'){const lu=lockUntil();if(lu){E.phase='locked';E.until=lu;render();return;}lockSet();}evalBeginTask();}else if(a==='next')evalNext();else if(a==='ans')evalAnswer(eb.dataset.k);else if(a==='leave')evalLeave();else if(a==='resend'){E.submit='sending';render();flushTests();}return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.hasAttribute('data-self')&&e.target!==el)return;
 if(el.disabled)return;runAct(el,e.target);});
appEl.addEventListener('input',e=>{const t=e.target;
 if(t.id==='otp'){t.value=t.value.replace(/\D/g,'').slice(0,4);S.otp=t.value;if(S.otpErr){S.otpErr=false;const er=appEl.querySelector('.err');if(er)er.remove();}}
  if(t.id==='oos_note')S.oosf.note=t.value;
 if(t.id==='chat_in')S.chatTxt=t.value;
 if(t.id==='uan_in'){t.value=t.value.replace(/\D/g,'').slice(0,12);S.uan=t.value;const b=appEl.querySelector('[data-tid="uan_submit"]');if(b)b.classList.toggle('dim',S.uan.length!==12);}
});
appEl.addEventListener('keydown',e=>{if(e.target.id==='otp'&&e.key==='Enter'){const b=appEl.querySelector('[data-tid="otp_submit"]');b&&b.click();}
 if(e.target.id==='chat_in'&&e.key==='Enter'){const b=appEl.querySelector('[data-tid="chat_send"]');b&&b.click();}
 if(e.target.classList&&e.target.classList.contains('knob')&&(e.key==='ArrowRight'||e.key==='Enter')){e.preventDefault();runAct({dataset:{act:'emgConfirm',tid:'emg_slide'},hasAttribute:()=>false},null);}});
function nudge(st){const el=[...appEl.querySelectorAll('[data-tid]')].find(e=>match(e.dataset.tid,st.hl));
 toast(L('For this step, tap the glowing button','Is step mein chamakta hua button dabayein'));
 if(el){el.classList.remove('nudge');void el.offsetWidth;el.classList.add('nudge');}}
function bindSlider(){const sl=appEl.querySelector('.slider.ready');if(!sl)return;const kn=sl.querySelector('.knob'),fill=sl.querySelector('.fill');let x0=null,max=0;
 const reset=()=>{kn.style.transform='';fill.style.width='0';x0=null;};
 kn.addEventListener('pointerdown',e=>{x0=e.clientX;max=sl.clientWidth-kn.offsetWidth-8;try{kn.setPointerCapture(e.pointerId);}catch(_){}});
 kn.addEventListener('pointermove',e=>{if(x0===null)return;const dx=Math.max(0,Math.min(max,e.clientX-x0));kn.style.transform=`translateX(${dx}px)`;fill.style.width=(dx+44)+'px';});
 const up=e=>{if(x0===null)return;const dx=e.clientX-x0;if(dx>=max*0.8){slidJust=true;x0=null;runAct({dataset:{act:'emgConfirm',tid:'emg_slide'},hasAttribute:()=>false},null);}else reset();};
 kn.addEventListener('pointerup',up);kn.addEventListener('pointercancel',reset);}

document.getElementById('panel').addEventListener('click',e=>{
 const l=e.target.closest('[data-lang]');if(l){LANG=l.dataset.lang;save();render();return;}
 const m=e.target.closest('[data-m]');if(m){startModule(m.dataset.m);return;}
 if(e.target.closest('[data-free-mode]')){startFree();return;}
 if(e.target.closest('[data-clear]')){DONE={};save();render();}
 if(e.target.closest('[data-evleave]')){evalLeave();return;}
 if(e.target.closest('[data-eval-start]')){evalStart();return;}
 if(e.target.closest('[data-reg-edit]')){REG=Object.assign({},PROF);paintPanel();return;}
 if(e.target.closest('[data-reg-save]')){const g=id=>(document.getElementById(id)||{}).value||'';const n=g('reg_name').trim().replace(/\s+/g,' '),ph=g('reg_phone').replace(/\D/g,''),b=g('reg_batch').trim();const er=document.getElementById('reg_err');
  if(n.length<2){if(er)er.textContent=L('Enter your full name','Apna poora naam likhein');return;}if(!/^[6-9]\d{9}$/.test(ph)){if(er)er.textContent=L('Enter a valid 10-digit mobile number','Sahi 10 ank ka mobile number likhein');return;}
  PROF={name:n,phone:ph,batch:b};REG=null;saveProf();render();toast(L('Saved. The app now uses your name.','Save ho gaya. App ab aapka naam use karega.'));return;}
 if(e.target.closest('[data-install]')&&window.__pwaPrompt){const pr=window.__pwaPrompt;pr.prompt();pr.userChoice.finally(()=>{window.__pwaPrompt=null;paintPanel();});}
});
document.getElementById('coach').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
 if(c==='menu')document.getElementById('shell').dataset.view='menu';
 else if(c==='restart'&&G.mod)startModule(G.mod.id);
 else if(c==='exit')exitModule();
 else if(c==='reset')startFree();
 else if(c==='evskip'&&E&&E.phase==='task')evalFinishTask(true);
 else if(c==='evleave')evalLeave();
});
/* Deep link: #<module id> or #free */
const hsh=(location.hash||'').slice(1);setTimeout(()=>{try{flushTests();}catch(e){}},1500);
document.getElementById('panel').addEventListener('input',e=>{if(REG===null&&PROF.name)return;const t=e.target;if(!REG)REG=Object.assign({},PROF);if(t.id==='reg_name')REG.name=t.value;if(t.id==='reg_phone'){t.value=t.value.replace(/\D/g,'').slice(0,10);REG.phone=t.value;}if(t.id==='reg_batch')REG.batch=t.value;});
if(/^(test|specific)=/.test(hsh)){const v=decodeURIComponent(hsh.split('=').slice(1).join('='));render();loadBank().then(()=>evalStart(hsh.startsWith('test=')?{mode:'general',key:v}:{mode:'specific',area:v})).catch(()=>toast(L('Question bank not found. Ask your trainer.','Question bank nahi mila. Trainer se baat karein.')));}
else if(MODULES.some(m=>m.id===hsh))startModule(hsh);else if(hsh==='free')startFree();else render();

/* ======================= Usage tracking (Pro-Abhyas Usage Tracker sheet) =======================
   Sends small rows to a Google Form (write-only, no-cors) so the trainer can see time spent and
   modules finished. Active time = page visible AND the pro touched/typed/scrolled in the last 90 s. */
(function(){try{
 const UFORM={url:'https://docs.google.com/forms/d/e/1FAIpQLSer0wsNv41YoIQc_VhQDRhVSyzdqGf_md-2Gn6OQ8jetI4MhQ/formResponse',e:{"Event_Id":"121588022","Session_Id":"115456794","Phone":"1380647497","Name":"1573047503","Event":"1788776875","Section":"2125624293","Module_Id":"856893742","Module_Title":"1445335204","Module_Group":"554951621","Seconds":"849539682","Steps_Done":"510087678","Total_Steps":"900053382","Lang":"806981688","Device":"1194376154","App_Version":"1199702951","Client_Time":"1030016944"}};
 const U_OUT='pa-usage-outbox',U_MAX=500,U_IDLE=90000,U_FLUSH=180;
 const PU=window.PA_USER||{};
 const uPh=String(PU.phone||'').replace(/\D/g,'').slice(-10);
 if(!uPh||PU.guest)return;
 const uName=String(PU.name||'').trim();
 const uSid='S'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 let uSeq=0;
 const uMob=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)?'mobile':'desktop';
 const uApp=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'app':'browser';
 const uDev=uMob+'-'+uApp;
 const pad=n=>String(n).padStart(2,'0');
 const uNow=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());};
 const uLang=()=>{try{return typeof LANG!=='undefined'?LANG:'';}catch(e){return '';}};
 const uVer=()=>{try{return (typeof APP_VERSION!=='undefined'?APP_VERSION:'')+'/u1';}catch(e){return 'u1';}};
 const uGroup=m=>{try{const g=GROUPS.find(x=>x.id===m.g||x.id===m.group||(x.mods&&x.mods.includes(m.id)));return g?(g.t&&g.t.en)||g.en||g.title||'':'';}catch(e){return '';}};
 const uTitle=m=>{try{return (m.t&&(m.t.en||m.t.hi))||m.title||m.id;}catch(e){return m.id;}};
 const isMod=m=>{try{return !!m&&MODULES.indexOf(m)>=0;}catch(e){return false;}};
 const ctx=()=>{let sec,mod=null;
  if(E||G.eval)sec='Test';else if(G.free)sec='App';else if(G.mod)sec='Practice';
  else sec=window.PA_MODE==='free'?'App':window.PA_MODE==='test'?'Test':'Practice';
  if(sec==='Practice'&&isMod(G.mod))mod=G.mod;
  return {sec,mod};};
 /* ---- outbox ---- */
 const rd=()=>{try{return JSON.parse(localStorage.getItem(U_OUT)||'[]')||[];}catch(e){return [];}};
 const wr=a=>{try{localStorage.setItem(U_OUT,JSON.stringify(a.slice(-U_MAX)));}catch(e){}};
 const inflight={};
 function send(keep){if(!navigator.onLine&&!keep)return;const a=rd();let n=0;
  for(const r of a){if(inflight[r.id]||n>=20)continue;n++;inflight[r.id]=1;
   const b=new URLSearchParams();Object.keys(r.f).forEach(k=>{if(UFORM.e[k]&&r.f[k]!==''&&r.f[k]!=null)b.append('entry.'+UFORM.e[k],String(r.f[k]));});
   fetch(UFORM.url,{method:'POST',mode:'no-cors',keepalive:!!keep,headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b.toString()})
    .then(()=>{wr(rd().filter(x=>x.id!==r.id));delete inflight[r.id];})
    .catch(()=>{delete inflight[r.id];});}}
 function log(ev,o){o=o||{};const c=o.ctx||ctx();const m=o.mod!==undefined?o.mod:c.mod;
  const f={Event_Id:uSid+'-'+(++uSeq)+'-'+Math.random().toString(36).slice(2,6),Session_Id:uSid,Phone:uPh,Name:uName,Event:ev,Section:c.sec,
   Module_Id:m?m.id:'',Module_Title:m?uTitle(m):'',Module_Group:m?uGroup(m):'',Seconds:o.sec!=null?Math.round(o.sec):'',
   Steps_Done:o.sd!=null?o.sd:'',Total_Steps:o.tot!=null?o.tot:'',Lang:uLang(),Device:uDev,App_Version:uVer(),Client_Time:uNow()};
  const a=rd();a.push({id:f.Event_Id,f});wr(a);}
 /* ---- active time ---- */
 let lastIn=Date.now(),acc=0,accCtx=null,modAcc=0;
 ['pointerdown','touchstart','keydown','wheel','scroll','input'].forEach(t=>window.addEventListener(t,()=>{lastIn=Date.now();},{capture:true,passive:true}));
 const same=(a,b)=>a&&b&&a.sec===b.sec&&a.mod===b.mod;
 function flushTime(){if(accCtx&&acc>=1)log('time',{ctx:accCtx,mod:accCtx.mod,sec:acc});acc=0;}
 /* ---- module start / done / exit ---- */
 let curG=null,curMod=null,reported=false;
 function check(){try{
  const g=(typeof G!=='undefined')?G:null;if(!g)return;
  const m=(!E&&!g.eval&&isMod(g.mod))?g.mod:null;
  if(g!==curG){
   if(curMod&&!reported)log('module_exit',{mod:curMod,ctx:{sec:'Practice',mod:curMod},sec:modAcc,sd:curG?curG.i:'',tot:curMod.steps.length});
   curMod=m;reported=false;modAcc=0;if(m)log('module_start',{mod:m,ctx:{sec:'Practice',mod:m},tot:m.steps.length});
   curG=g;}
  if(curMod&&g.done&&!reported){reported=true;log('module_done',{mod:curMod,ctx:{sec:'Practice',mod:curMod},sec:modAcc,sd:g.i,tot:curMod.steps.length});send();}
 }catch(e){}}
 function tick(){const now=Date.now();check();const c=ctx();
  if(!same(c,accCtx)){flushTime();accCtx=c;}
  if(document.visibilityState==='visible'&&now-lastIn<U_IDLE){acc+=1;if(curMod&&!reported)modAcc+=1;}
  if(acc>=U_FLUSH){flushTime();send();}}
 setInterval(tick,1000);
 setInterval(()=>{if(rd().length)send();},60000);
 /* wrap engine functions so start/done/exit are caught at once */
 try{const w=(fn)=>function(){check();const r=fn.apply(this,arguments);check();return r;};
  fire=(function(f){return function(){const r=f.apply(this,arguments);check();return r;};})(fire);
  startModule=w(startModule);startFree=w(startFree);exitModule=w(exitModule);
  if(typeof evalStart==='function')evalStart=w(evalStart);if(typeof evalLeave==='function')evalLeave=w(evalLeave);}catch(e){}
 const bye=()=>{check();flushTime();send(true);};
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')bye();else lastIn=Date.now();});
 window.addEventListener('pagehide',bye);
 window.addEventListener('online',()=>send());
 accCtx=ctx();log('open');setTimeout(()=>{check();send();},2500);
}catch(e){}})();



})();
</script>
